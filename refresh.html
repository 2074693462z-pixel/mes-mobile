<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>刷新</title>
<style>body { font: 18px/1.6 sans-serif; padding: 40px 20px; text-align: center; }</style>
</head>
<body>
<p id="msg">正在清理旧版本，马上回到首页…<br>Đang dọn phiên bản cũ, sắp quay lại trang chính…</p>
<script>
// A phone stuck on an old cached page opens this URL once: it drops the service worker and the page caches (never IndexedDB /
// localStorage, so unexported records stay), then loads index.html fresh from the network, which registers the new worker.
(async () => {
  try {
    if (navigator.serviceWorker) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    for (const k of await caches.keys()) await caches.delete(k);
  } catch (e) { document.getElementById("msg").textContent = "清理失败：" + e; return; }
  location.replace("index.html?r=" + Date.now());
})();
</script>
</body>
</html>
