<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="物品采集">
<title>物品采集</title>
<style>
:root { --bg:#f4f6fa; --card:#fff; --text:#1c2333; --sub:#667085; --line:#d8dee9; --main:#1f6feb; --danger:#d92d20; --ok:#12805c; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#12151c; --card:#1b2029; --text:#e6e9f0; --sub:#98a2b3; --line:#2f3745; --main:#4c8dff; --danger:#f97066; --ok:#3ccb92; }
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,"Microsoft YaHei",sans-serif; padding-bottom:calc(84px + env(safe-area-inset-bottom)); }
header { position:sticky; top:0; z-index:5; background:var(--main); color:#fff; padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top)); display:flex; align-items:center; justify-content:space-between; }
header h1 { font-size:18px; margin:0; }
header span { font-size:13px; opacity:.9; }
main { padding:12px 16px; max-width:640px; margin:0 auto; }
.seg { display:flex; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:12px; }
.seg button { flex:1; border:0; background:none; color:var(--text); padding:11px 4px; font-size:15px; }
.seg button.on { background:var(--main); color:#fff; font-weight:600; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
label { display:block; font-size:13px; color:var(--sub); margin:10px 0 4px; }
label:first-child { margin-top:0; }
label b { color:var(--danger); }
input, select, textarea { width:100%; font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; }
textarea { min-height:64px; resize:vertical; }
.hint { font-size:12px; color:var(--sub); margin-top:4px; }
.photo { display:flex; gap:12px; align-items:center; }
.photo .pv { width:96px; height:96px; border-radius:10px; background:var(--bg); border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:12px; overflow:hidden; flex:none; }
.photo .pv img { width:100%; height:100%; object-fit:cover; }
.btn { display:inline-block; border:0; border-radius:10px; padding:12px 16px; font-size:16px; background:var(--main); color:#fff; }
.btn.ghost { background:none; color:var(--main); border:1px solid var(--main); }
.btn.danger { background:none; color:var(--danger); border:1px solid var(--danger); }
.btn.block { width:100%; }
.row { display:flex; gap:8px; }
.row > * { flex:1; }
.keep { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:14px; color:var(--sub); }
.keep input { width:auto; }
.bar { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px; z-index:6; }
.bar .btn { flex:1; }
#list { padding:4px 12px; }
.item { display:flex; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); cursor:pointer; }
.item:last-child { border-bottom:0; }
.selbar { display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:12px; color:var(--sub); }
.selbar .btn { padding:6px 14px; font-size:14px; flex:none; }
.ck { flex:none; display:flex; align-items:center; justify-content:center; width:32px; height:40px; }
.ck input { width:20px; height:20px; margin:0; }
.item:active { background:var(--bg); }
.item img, .item .ph { width:40px; height:40px; border-radius:6px; object-fit:cover; background:var(--bg); flex:none; }
.item img.shared { opacity:.55; }
.item .t { flex:1; min-width:0; line-height:1.3; }
.item .t div { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item .t .n { font-size:14px; }
.item .t .s { font-size:12px; color:var(--sub); }
.item .t .s.code { color:var(--text); }
.item .when { flex:none; font-size:11px; color:var(--sub); text-align:right; line-height:1.3; }
.tag { font-size:10px; padding:0 5px; border-radius:5px; background:var(--bg); border:1px solid var(--line); color:var(--sub); margin-right:4px; }
.tag.done { color:var(--ok); border-color:var(--ok); }
.editbar { display:flex; align-items:center; justify-content:space-between; gap:8px; background:#fff7e0; color:#7a5200; border:1px solid #f0d58a; border-radius:10px; padding:8px 12px; margin-bottom:12px; font-size:14px; }
.editbar .btn { padding:6px 12px; font-size:14px; background:#fff; }
.dsheet { max-height:90vh; overflow:auto; }
.dhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.dhead h2 { margin:0; font-size:16px; }
.dgrid { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:14px; }
.dgrid .k { color:var(--sub); white-space:nowrap; }
.dgrid .v { word-break:break-all; }
.dphotos { display:flex; gap:8px; margin:8px 0; flex-wrap:wrap; }
.dphotos figure { margin:0; text-align:center; font-size:11px; color:var(--sub); }
.dphotos img { width:96px; height:96px; object-fit:cover; border-radius:8px; display:block; }
.dbtns { display:flex; gap:8px; margin-top:12px; }
.dbtns .btn { flex:1; padding:10px 4px; font-size:15px; }
.empty { text-align:center; color:var(--sub); padding:32px 0; }
.toast { position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#101828; color:#fff; padding:10px 16px; border-radius:20px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:9; max-width:90%; }
.toast.show { opacity:1; }
.hidden { display:none !important; }
.place { border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--bg); }
.place .row { margin-bottom:8px; }
.place .seg { margin-bottom:8px; background:var(--card); }
.place .seg button { padding:8px 4px; }
.row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.place input, .place select { background:var(--card); }
.place .cascade select { margin-bottom:8px; }
.mapv { position:fixed; inset:0; z-index:25; background:var(--bg); display:flex; flex-direction:column; }
.mapv .top { display:flex; align-items:center; gap:8px; padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top)); background:var(--main); color:#fff; }
.mapv .top b { flex:1; font-size:15px; }
.mapv .top button { border:0; background:rgba(255,255,255,.2); color:#fff; border-radius:8px; padding:6px 12px; font-size:14px; }
#mapPickHost { flex:1; min-height:0; display:flex; flex-direction:column; }
#pageMap { height:100%; display:flex; flex-direction:column; }
main#main.map-mode { padding:0; max-width:none; overflow:hidden; }
#mapBody { flex:1; min-height:0; display:flex; flex-direction:column; position:relative; }
.mb-search { position:relative; padding:8px 10px 0; }
.mb-search input { padding:9px 10px; }
.mb-res { position:absolute; left:10px; right:10px; top:100%; z-index:8; max-height:55vh; overflow:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.28); }
.mb-res .g { padding:5px 12px; font-size:12px; color:var(--sub); background:var(--bg); position:sticky; top:0; }
.mb-res .r { padding:8px 12px; border-bottom:1px solid var(--line); font-size:14px; }
.mb-res .r:last-child { border-bottom:0; }
.mb-res .r:active { background:var(--bg); }
.mb-res .r small { display:block; color:var(--sub); font-size:12px; }
#mapBody .tabs { display:flex; gap:6px; padding:8px 10px 0; overflow-x:auto; flex:none; }
#mapBody .tabs button { flex:none; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; padding:6px 12px; font-size:14px; }
#mapBody .tabs button small { opacity:.65; margin-left:2px; }
#mapBody .tabs button.on { background:var(--main); color:#fff; border-color:var(--main); }
#mapBody .mvinfo { padding:6px 12px; font-size:12px; color:var(--sub); flex:none; }
#mapBody .mvinfo b { color:var(--text); }
#mvView { position:relative; flex:1; min-height:0; overflow:hidden; background:#0f1520; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; }
#mvStage { position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }
#mvStage img { display:block; max-width:none; -webkit-user-drag:none; pointer-events:none; }
#mvMarks { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.mk { position:absolute; box-sizing:border-box; border:2px solid #ffb020; background:rgba(255,176,32,.2); border-radius:3px; overflow:hidden; display:flex; align-items:center; justify-content:center; text-align:center; color:#fff; font-size:12px; font-weight:600; line-height:1.15; text-shadow:0 0 3px #000,0 0 3px #000,0 0 2px #000; }
.mk span { max-width:100%; max-height:100%; overflow:hidden; padding:1px 2px; word-break:break-all; }
.mk.v span { writing-mode:vertical-rl; }
.mk.nolabel span { display:none; }
.mk.hot { border-color:#ff3c3c; background:rgba(255,60,60,.4); z-index:2; }
.mk.sel { border-color:#5b8cff; background:rgba(36,99,235,.45); z-index:3; }
.mv-tag { position:absolute; z-index:4; pointer-events:none; background:rgba(16,24,40,.92); color:#fff; border-radius:6px; padding:2px 8px; font-size:13px; white-space:nowrap; max-width:80%; overflow:hidden; text-overflow:ellipsis; }
.mv-ctl { position:absolute; right:10px; bottom:12px; display:flex; flex-direction:column; gap:6px; z-index:5; }
.mv-ctl button { width:42px; height:42px; border:0; border-radius:10px; background:rgba(20,26,38,.85); color:#fff; font-size:20px; }
.mv-ctl button.off { opacity:.45; }
.mb-sheet { flex:none; max-height:34%; overflow:auto; background:var(--card); border-top:1px solid var(--line); padding:10px 12px; font-size:14px; }
.mb-sheet .nm { font-size:16px; font-weight:600; }
.mb-sheet .pth { font-family:ui-monospace,Menlo,Consolas,monospace; color:var(--sub); font-size:13px; }
.mb-sheet .hint { margin-top:2px; }
.mb-sheet .chips2 span { display:inline-block; border:1px solid var(--line); border-radius:12px; padding:1px 8px; margin:4px 4px 0 0; font-size:12px; }
.mb-sheet .btns { display:flex; gap:8px; margin-top:8px; }
.mb-sheet .btns .btn { flex:1; padding:9px; font-size:14px; }
#mapBody .foot { flex:none; display:flex; gap:8px; padding:8px 12px calc(8px + env(safe-area-inset-bottom)); background:var(--card); border-top:1px solid var(--line); }
#mapBody .foot .btn { padding:10px 14px; font-size:15px; }
#mapBody .foot .btn[disabled] { opacity:.4; }
#mapBody .foot .grow { flex:1; }
.more { margin-top:12px; border-top:1px dashed var(--line); padding-top:10px; }
.more summary { color:var(--main); font-size:14px; padding:6px 0; }
.withscan { display:flex; gap:8px; }
.withscan input { flex:1; min-width:0; }
.scanbtn { flex:none; border:1px solid var(--main); background:none; color:var(--main); border-radius:8px; padding:0 14px; font-size:15px; }
.scan { position:fixed; inset:0; z-index:30; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#fff; }
.scan video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.scan .frame { position:relative; width:72vw; max-width:360px; height:36vw; max-height:200px; border:3px solid #4c8dff; border-radius:12px; box-shadow:0 0 0 100vmax rgba(0,0,0,.45); }
.scan p, .scan .btn { position:relative; margin:0; }
.scan .btn { background:#fff; color:#111; }
.mask { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
.sheet { background:var(--card); width:100%; max-width:640px; border-radius:16px 16px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); }
.sheet h2 { margin:0 0 4px; font-size:17px; }
.sheet p { margin:0 0 14px; color:var(--sub); font-size:14px; }
.sheet .btn { margin-top:8px; }
/* ---- 紧凑布局：覆盖前面的尺寸 ---- */
body { font-size:14px; line-height:1.3; padding-bottom:calc(56px + env(safe-area-inset-bottom)); }
header { padding:7px 12px; padding-top:calc(7px + env(safe-area-inset-top)); }
header h1 { font-size:16px; }
header span { font-size:12px; }
main { padding:8px 10px; }
.seg { margin-bottom:8px; border-radius:8px; }
.seg button { padding:7px 4px; font-size:14px; }
.card { padding:8px 10px; margin-bottom:8px; border-radius:10px; }
#fields { display:grid; grid-template-columns:1fr 1fr; column-gap:8px; }
#fields .f { grid-column:span 2; min-width:0; }
#fields .f.half { grid-column:span 1; }
#fields details.more { grid-column:span 2; display:grid; grid-template-columns:1fr 1fr; column-gap:8px; margin-top:6px; padding-top:4px; }
details.more > summary { grid-column:span 2; font-size:13px; padding:4px 0; }
label { font-size:12px; margin:6px 0 2px; }
input, select, textarea { font-size:14px; padding:5px 8px; border-radius:6px; min-height:32px; }
textarea { min-height:40px; }
.hint { font-size:11px; margin-top:2px; }
.btn { padding:8px 12px; font-size:15px; border-radius:8px; }
.bar { padding:6px 10px calc(6px + env(safe-area-inset-bottom)); gap:6px; }
.place { padding:6px; border-radius:8px; }
.place .row { margin-bottom:6px; gap:6px; }
.place .seg { margin-bottom:6px; }
.place .seg button { padding:5px 4px; }
.row3 { gap:6px; }
.withscan { gap:6px; }
.scanbtn { padding:0 10px; font-size:14px; border-radius:6px; }
.editbar { padding:5px 10px; margin-bottom:8px; font-size:13px; }
.ptiles { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; align-items:flex-start; }
#xphotos { display:contents; }
.ptile { width:64px; text-align:center; }
.plabel { font-size:11px; color:var(--sub); white-space:nowrap; margin-bottom:2px; }
.ptile .pv { width:64px; height:64px; border-radius:8px; background:var(--bg); border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:11px; overflow:hidden; }
.ptile .pv img { width:100%; height:100%; object-fit:cover; cursor:zoom-in; }
.pbtn { margin-top:3px; border:1px solid var(--main); background:none; color:var(--main); border-radius:6px; font-size:12px; padding:2px 0; width:100%; }
.lb { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.92); display:flex; align-items:center; justify-content:center; }
.lb img { max-width:100%; max-height:100%; object-fit:contain; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.chip { border:1px solid var(--line); background:var(--bg); color:var(--text); border-radius:14px; padding:4px 12px; font-size:12px; }
.stockScanBar { position:relative; z-index:1; display:flex; align-items:center; gap:8px; background:rgba(0,0,0,.55); border-radius:10px; padding:8px 10px; width:calc(100% - 32px); max-width:360px; }
.stockScanBar label { margin:0; color:#fff; font-size:12px; white-space:nowrap; }
.stockScanBar input { background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.4); color:#fff; }
#list { padding:2px 10px; }
.item { padding:4px 0; gap:8px; }
.item img, .item .ph { width:34px; height:34px; border-radius:5px; }
.item .t .n { font-size:13px; }
.item .t .s { font-size:11px; }
.dphotos img { width:64px; height:64px; cursor:zoom-in; }
.dphotos { gap:6px; margin:6px 0; }
.dgrid { font-size:13px; gap:2px 10px; }
.sheet { padding:12px 12px calc(12px + env(safe-area-inset-bottom)); }
.dbtns .btn { padding:8px 4px; font-size:14px; }
.toast { bottom:calc(64px + env(safe-area-inset-bottom)); font-size:13px; padding:8px 14px; }

/* ---- 名称写在格子里 ---- */
#fields .f { margin-bottom:6px; }
.fl { display:flex; gap:6px; }
.fl .box { position:relative; flex:1; min-width:0; }
.fl input, .fl select, .fl textarea { height:40px; min-height:0; padding:15px 8px 3px; }
.fl textarea { height:58px; padding-top:17px; }
.fl select { padding-right:20px; }
.fl label { position:absolute; left:9px; top:10px; margin:0; font-size:14px; color:var(--sub); pointer-events:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:calc(100% - 24px); transition:top .1s, font-size .1s; }
.fl .box.filled label, .fl .box:focus-within label { top:2px; font-size:10px; }
.fl label b { color:var(--danger); }
.fl label .tip { opacity:.7; }
.fl label .tip::before { content:" · "; }
.fl input::placeholder, .fl textarea::placeholder { color:transparent; }
.fl .box:focus-within input::placeholder { color:var(--sub); opacity:.7; }
.scanbtn { height:40px; }
.ptitle { font-size:11px; color:var(--sub); margin-bottom:4px; }
.ptitle b { color:var(--danger); }
header .hr { display:flex; align-items:center; gap:8px; }
#langBtn { background:rgba(255,255,255,.2); color:#fff; border:1px solid rgba(255,255,255,.65); border-radius:12px; padding:2px 10px; font-size:12px; }

/* ---- 操作按钮放顶部；底部留空，避开 Netlify 免费版右下角的浮标 ---- */
.top { position:sticky; top:0; z-index:6; }
.top header { position:static; }
.top .bar { position:static; border-top:0; border-bottom:1px solid var(--line); padding:6px 10px; }
body { padding-bottom:calc(96px + env(safe-area-inset-bottom)); }
.toast { bottom:auto; top:calc(104px + env(safe-area-inset-top)); }
.sheet { padding-bottom:calc(80px + env(safe-area-inset-bottom)); }
.scan .btn { margin-bottom:60px; }

/* ---- 整体布局：顶部固定，中间表单框内滚动，底部是按钮，再往下留一条空白（避开 Netlify 浮标）---- */
html, body { height:100%; }
body { display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden; padding:0; }
.top { position:static; flex:none; }
.top #tabs { margin:6px 10px 0; }
main#main { flex:1; min-height:0; width:100%; max-width:640px; margin:0 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:8px 10px; }
.bar { position:static; flex:none; border-top:1px solid var(--line); border-bottom:0; padding:6px 10px; width:100%; max-width:640px; margin:0 auto; }
.bar #save { flex:1.6; }
.spacer { flex:none; height:calc(60px + env(safe-area-inset-bottom)); background:var(--card); border-top:1px solid var(--line); }
.toast { top:calc(104px + env(safe-area-inset-top)); }
</style>
</head>
<body>
<div class="top"><header><h1>物品采集</h1><div class="hr"><span id="count"></span><button id="langBtn" type="button">Tiếng Việt</button></div></header>
  <div class="seg" id="tabs">
    <button data-tab="new" class="on">录入</button>
    <button data-tab="list">已记录</button>
    <button data-tab="stock">盘点</button>
    <button data-tab="map">地图</button>
  </div>
</div>
<main id="main">
<div class="editbar hidden" id="insecureBar" style="margin-bottom:12px"><span>⚠️ 当前网址不是 https，拍照扫码和「分享/保存」可能用不了；请用 https 网址打开（比如部署到 Netlify 后给你的网址），或改用蓝牙扫码枪+手动输入</span></div>

  <section id="pageNew">
    <div class="editbar hidden" id="editBar"><span>正在修改：<b id="editName" data-raw></b></span><button class="btn ghost" id="editCancel" type="button">取消</button></div>
    <div class="seg" id="types"></div>
    <div class="card">
      <div id="fields"></div>
      <div class="ptiles">
        <div class="ptile">
          <div class="plabel">照片 <b id="photoStar">*</b></div>
          <div class="pv" id="pv">未拍照</div>
          <button class="pbtn" id="shoot" type="button">拍照</button>
        </div>
        <div id="xphotos"></div>
      </div>
      <div class="hint" id="photoHint"></div>
      <input type="file" id="cam" accept="image/*" capture="environment" class="hidden">
      <input type="file" id="xcam" accept="image/*" capture="environment" class="hidden">
      <select id="keepMode">
        <option value="all">保存后：同款连续录入（只改编号、拍照）</option>
        <option value="common">保存后：只保留类别、位置等常用项</option>
        <option value="none">保存后：全部清空</option>
      </select>
    </div>
  </section>

  <section id="pageList" class="hidden">
    <div class="selbar">
      <button class="btn ghost" id="selAll" type="button">全选</button>
      <span id="selInfo">不选则只导出「待导出」的；勾选后可重复导出已导出的</span>
    </div>
    <div class="card" id="list"></div>

// ---- 位置：统一写成  栋-楼层-产线  或  栋-楼层-区-层-格，与仓库系统的位置库写法一致 ----------
//   货架：V3-2F-M-3-1（3栋 2楼 M区 3层 1格）      产线：V3-2F-FHA-01（3栋 2楼 产线 FHA-01）

const opt = (v, label, cur) => `<option value="${v}"${String(v) === String(cur) ? " selected" : ""}>${label}</option>`;

// ---- 位置库：电脑端导出的位置树（locations.js，[编号, 短写法, 名称, 上级编号, 深度]），一级一级选 ------------
// 树是空的（还没导出过）就退回上面的「栋/层/区/排/格」手填。每一级最后一项是「＋新增」，加的位置存在本机，
// 记录里照常写成短写法（如 V1-1F-B-2-02）；电脑端导入后，不在库里的会进「位置对照」处理。
let TREE = null;
const unpad = p => String(p || "").replace(/(?<=-)0+(\d)/g, "$1");
const loadExtra = () => { try { return JSON.parse(localStorage.getItem("libExtra") || "[]"); } catch { return []; } };
function buildTree() {
  const nodes = (window.LOCATIONS || []).map(r => ({ code: r[0], path: r[1], name: r[2], parent_code: r[3], depth: r[4], name_vi: r[5] || "" }));
  const codes = new Set(nodes.map(n => n.code)), paths = new Set(nodes.map(n => n.path));
  for (const n of loadExtra()) {            // 手机上自己加的；电脑端位置库里已经有同名的就用库里的
    if (paths.has(n.path) || codes.has(n.code) || !codes.has(n.parent_code)) continue;
    nodes.push(n); codes.add(n.code); paths.add(n.path);
  }
  TREE = null;
  if (!nodes.length) return;
  const byCode = new Map(nodes.map(n => [n.code, n]));
  const byPath = new Map(nodes.map(n => [n.path, n]));
  const byUnpadded = new Map(nodes.map(n => [unpad(n.path), n]));
  const children = new Map();
  for (const n of nodes) {
    const parent = byCode.has(n.parent_code) ? n.parent_code : "";
    if (!children.has(parent)) children.set(parent, []);
    children.get(parent).push(n);
  }
  for (const list of children.values()) list.sort((x, y) => String(x.path).localeCompare(String(y.path), undefined, { numeric: true }));
  const roots = children.get("") || [];      // 最上面只有一个厂区（AVC(VN)）就不用选，从下一级开始
  const start = roots.length === 1 && roots[0].depth === 1 && children.has(roots[0].code) ? roots[0].code : "";
  TREE = { byCode, byPath, byUnpadded, children, start };
}
buildTree();
const findNode = v => TREE ? TREE.byPath.get(v) || TREE.byUnpadded.get(unpad(v)) : null;
// 跟电脑端位置库同一套缩写：1栋→V1，2楼→2F，B区→B，2排→2，06格→06
function compactSegment(text) {
  text = text.trim();
  let m = /^(\d+)\s*栋$/.exec(text); if (m) return "V" + m[1];
  m = /^([A-Za-z]?\d+)\s*楼$/.exec(text); if (m) return m[1] + "F";
  m = /^(.+?)\s*(?:区|排|格|柜|层|架|位)$/.exec(text);
  return m ? m[1].trim() : text;
}
function libLabel(node, parent) {
  const short = parent && node.path.startsWith(parent.path + "-") ? node.path.slice(parent.path.length + 1) : node.path;
  const name = lang === "vi" ? (node.name_vi || node.name) : node.name;      // 越南文名称（电脑端位置库里翻译好的）
  return name && name !== short ? `${short} · ${name}` : short;
}
// 从最上面一直到当前位置，每一级一个下拉；选到楼层或下面还有东西时再多出一级
function libCascade(pre, path) {
  const node = findNode(path), chain = [];
  for (let n = node; n && n.code !== TREE.start && !chain.includes(n); n = TREE.byCode.get(n.parent_code)) chain.unshift(n);
  const parts = [];
  let parent = TREE.start;
  for (let level = 0; level < 8; level++) {
    const parentNode = TREE.byCode.get(parent), chosen = chain[level];
    const kids = TREE.children.get(parent) || [];
    parts.push(`<select ${level === 0 ? `id="${pre}_b" ` : ""}data-lib-level data-parent="${safe(parent)}">
      <option value="">${level === 0 ? "选楼栋" : "（不再细分）"}</option>
      ${kids.map(k => `<option data-raw value="${safe(k.code)}"${k === chosen ? " selected" : ""}>${safe(libLabel(k, parentNode))}</option>`).join("")}
      ${parent ? `<option value="__new__">＋ 新增…</option>` : ""}</select>`);
    if (!chosen) break;
    if (!(TREE.children.get(chosen.code) || []).length && !/^\d+F$/i.test(chosen.path.split("-").pop())) break;   // 楼层下面可以加产线 / 货架
    parent = chosen.code;
  }

function addLibNode(parent) {

// ---- 地图模块（marks.js 由电脑端导出：楼层图 + 标注方块）-------------------------------------------
// 一个地图组件（#mapBody）两处用：「地图」标签页里随便看；录入 / 盘点选位置时放进全屏的 #mapView 里点选。
// 拖动、双指缩放、双击放大都是自己实现的（图和方块用同一套坐标），方块上直接写名称，可以搜索位置或名称。

const segs = s => String(s || "").toUpperCase().split(/[-/／\s]+/).filter(Boolean).map(p => /^\d+$/.test(p) ? String(+p) : p);

function marksFor(place) {

let dbp = null;
function db() {
  if (!dbp) dbp = new Promise((ok, no) => {
    const r = indexedDB.open("collector", 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains("records")) d.createObjectStore("records", { keyPath: "id", autoIncrement: true });
      if (!d.objectStoreNames.contains("stock")) d.createObjectStore("stock", { keyPath: "id", autoIncrement: true });
    };
    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
  });
  return dbp;
}
async function tx(store, mode, fn) {
  const d = await db();
  return new Promise((ok, no) => {
    const t = d.transaction(store, mode);
    const res = fn(t.objectStore(store));
    t.oncomplete = () => ok(res && res.result);
    t.onerror = () => no(t.error);
  });
}

// 缩小并转 JPEG（长边 1280），一张约 150–300 KB，导出包不会太大
async function shrink(file, max = 1280) {   // 铭牌上的小字要看得清，附加照片用更大的尺寸
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch { bmp = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(file); }); }
  const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight;
  const s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(ok => c.toBlob(ok, "image/jpeg", 0.82));
}

function loadZXing() {

    toast(e && e.name === "NotAllowedError" ? "没有相机权限，请在浏览器设置里允许，或手动输入" : "打不开相机，请手动输入");

// ---- 导出：一个 zip，里面是每类一张 CSV + photos 文件夹 --------------------------------
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

// 不压缩（JPEG 本身已压缩），文件名按 UTF-8 存，解压后中文不会乱码
function makeZip(files) {
  const enc = new TextEncoder(), chunks = [], central = [];
  const d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, time, true); h.setUint16(12, date, true); h.setUint32(14, crc, true);
    h.setUint32(18, f.data.length, true); h.setUint32(22, f.data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
    chunks.push(new Uint8Array(h.buffer), name, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, time, true); c.setUint16(14, date, true); c.setUint32(16, crc, true);
    c.setUint32(20, f.data.length, true); c.setUint32(24, f.data.length, true); c.setUint16(28, name.length, true);
    c.setUint32(42, offset, true);
    central.push(new Uint8Array(c.buffer), name);
    offset += 30 + name.length + f.data.length;
  }
  const size = central.reduce((n, p) => n + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, size, true); end.setUint32(16, offset, true);
  return new Blob([...chunks, ...central, new Uint8Array(end.buffer)], { type: "application/zip" });
}
const csvCell = v => /[",\r\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;

const stamp = () => { const d = new Date(), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; };

async function buildPackage() {
  const recs = (await allRecs()).filter(r => sel.size ? sel.has(r.id) : !r.exported).sort((a, b) => a.created - b.created);
  if (!recs.length) return null;
  const enc = new TextEncoder(), files = [], t = stamp();
  let n = 0;
  for (const [key, def] of Object.entries(TYPES)) {
    const mine = recs.filter(r => r.type === key);
    if (!mine.length) continue;
    const extras = def.extraPhotos || [];
    const cols = [...def.fields.map(f => f.k), PHOTO_COL, ...extras];
    const lines = [cols.map(csvCell).join(",")];
    for (const r of mine) {
      let file = "";
      if (r.photo) {
        file = `photos/${key}_${t}_${String(++n).padStart(3, "0")}.jpg`;
        files.push({ name: file, data: new Uint8Array(await r.photo.arrayBuffer()) });
      }
      const more = [];
      for (const k of extras) {
        const blob = xget(r, k);
        if (!blob) { more.push(""); continue; }
        const name = `photos/${key}_${t}_${String(++n).padStart(3, "0")}_${{ "设备标签照片": "label", "资产标签照片": "asset", "铭牌照片": "plate" }[k]}.jpg`;
        files.push({ name, data: new Uint8Array(await blob.arrayBuffer()) });
        more.push(name);
      }
      lines.push([...def.fields.map(f => r.data[f.k] || ""), file, ...more].map(csvCell).join(","));
    }
    // UTF-8 带 BOM：Excel 打开不乱码，电脑端导入也能识别
    files.unshift({ name: `${def.label}.csv`, data: enc.encode("﻿" + lines.join("\r\n") + "\r\n") });
  }
  return { blob: makeZip(files), name: `采集_${t}.zip`, ids: recs.map(r => r.id), photos: n };
}

const IN_WECHAT = /MicroMessenger/i.test(navigator.userAgent);
let pending = null;
// 微信内置浏览器不支持下载、也不支持 Web Share，之前「分享」「保存」两个按钮在微信里还留着能点，
// 点了却什么都不会发生（原地失败），容易让人以为是卡住了——这里直接把两个按钮换成提示，别让人白点

  $("wxTip").classList.toggle("hidden", !IN_WECHAT);
  // 「分享」按钮点了必失败就别露出来——安卓和 iPhone 的浏览器常常不让分享 zip 这种文件
  // （只对图片/视频/PDF 等少数类型开放），点了也就是弹个「分享失败」，不如直接引导去保存。
  $("doShare").classList.toggle("hidden", IN_WECHAT || !pending.canShare);
  $("doSave").classList.toggle("hidden", IN_WECHAT);
  $("mask").classList.remove("hidden");
}
async function doItemExport() {

  if (!pkg) { toast("没有待导出的记录"); return; }
  const file = new File([pkg.blob], pkg.name, { type: "application/zip" });
  pending = { kind: "item", pkg, file, blob: pkg.blob, name: pkg.name,
    canShare: !!(navigator.canShare && navigator.canShare({ files: [file] })) };
  $("sheetInfo").textContent = `${pkg.ids.length} 条记录，${pkg.photos} 张照片，${(pkg.blob.size / 1048576).toFixed(1)} MB` +
    (pending.canShare ? "" : "。此环境不支持直接分享，请点「保存到手机」，再打开微信自己发一条消息（比如发给「文件传输助手」），点「+」选「文件」找到它发送");

function closeSheet() { $("mask").classList.add("hidden"); pending = null; }
async function finish(how) {
  const p = pending; closeSheet();
  if (p.kind === "stock") {
    for (const id of p.ids) { const r = (await allStock()).find(x => x.id === id); if (r) { r.exported = true; await putStock(r); } }
    refreshStockList(); refreshStockCount();
    toast(`${how}：${p.ids.length} 条`);
    return;
  }
  sel.clear();
  await markExported(p.pkg.ids);
  updateSel();
  toast(`${how}：${p.pkg.ids.length} 条，${p.pkg.photos} 张照片`);
}
async function shareNow() {
  if (!pending) return;
  if (!navigator.share) { toast("此浏览器或连接方式不支持分享，请改用「保存到手机」"); return; }
  try { await navigator.share({ files: [pending.file], title: pending.name }); }
  catch (e) { if (e.name !== "AbortError") toast(`分享失败（${e.name || e}），请改用「保存到手机」`); return; }
  finish("已分享");
}
function saveNow() {
  if (!pending) return;
  if (IN_WECHAT) { toast("微信里不能下载，请点右上角「···」→「在浏览器打开」后再导出"); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(pending.blob); a.download = pending.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  finish("已保存");
}

  type = b.dataset.type; extra = {}; renderTypes(); renderForm();
});
$("fields").addEventListener("click", e => {
  const b = e.target.closest("#p_mode button"); if (!b) return;
  const shelf = b.dataset.m === "shelf";
  $("p_mode").dataset.mode = b.dataset.m;
  for (const x of $("p_mode").children) x.classList.toggle("on", x === b);
  $("p_shelf").classList.toggle("hidden", !shelf);
  $("p_line").classList.toggle("hidden", shelf);
  updatePlaceView();
});
$("fields").addEventListener("input", e => {
  const el = e.target, k = el.id && el.id.slice(2);
  if (el.dataset && el.dataset.code && !e.isComposing) { const c = codeClean(k, el.value); if (c !== el.value) el.value = c; }
  if (k === "型号") fillMaker();
  updatePlaceView(); updatePhotoHint(); syncFilled(); });
$("fields").addEventListener("change", () => { toggleWhen(); syncFilled(); });
// 日期框：没点之前是普通文字框（好放名称），点进去才变成日期选择
$("fields").addEventListener("focusin", e => {
  const el = e.target;
  if (el.dataset && el.dataset.date && el.type === "text") { el.type = "date"; try { el.showPicker && el.showPicker(); } catch {} }
});
$("fields").addEventListener("focusout", e => {
  const el = e.target;
  if (el.dataset && el.dataset.date && el.type === "date" && !el.value) el.type = "text";
  syncFilled();
});
$("fields").addEventListener("click", e => {
  const b = e.target.closest("[data-scan]"); if (b) startScan(b.dataset.scan);
});
$("scanCancel").onclick = stopScan;
$("xphotos").addEventListener("click", e => {
  const b = e.target.closest("[data-x]"); if (!b) return;
  extraTarget = b.dataset.x; $("xcam").click();
});
$("xcam").onchange = async e => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file || !extraTarget) return;
  const k = extraTarget;
  try { extra[k] = await shrink(file, 1600); showExtra(k); } catch { toast("这张图片读不出来，请重拍"); }
};
$("shoot").onclick = () => $("cam").click();
$("cam").onchange = onFile;
// 点缩略图放大看，再点一下关闭
document.addEventListener("click", e => {
  const img = e.target.closest(".pv img, .dphotos img");
  if (img) { $("lbImg").src = img.src; $("lb").classList.remove("hidden"); }
});
$("lb").onclick = () => { $("lb").classList.add("hidden"); $("lbImg").removeAttribute("src"); };
$("save").onclick = () => save().catch(e => toast("保存失败：" + (e && e.message ? e.message : e)));
$("export").onclick = () => doItemExport().catch(() => toast("导出失败"));
$("stockExport").onclick = () => doStockExport().catch(() => toast("导出失败"));
// 清空当前填写的内容（信息、照片、沿用下来的内容全部清掉）
$("clearForm").onclick = () => {
  const filled = [...$("fields").querySelectorAll("input,select,textarea")].some(e => e.value) || photo || Object.keys(extra).length;
  if (filled && !confirm(T("清空当前填写的内容？"))) return;
  for (const k of Object.keys(kept)) if (k.startsWith(type)) delete kept[k];
  extra = {}; setPhoto(null); renderForm();
  $("main").scrollTo({ top: 0 });
  toast("已清空");
};
$("doShare").onclick = shareNow;
$("doSave").onclick = saveNow;
$("doCancel").onclick = closeSheet;
$("selAll").onclick = () => {
  const all = listIds.length > 0 && listIds.every(id => sel.has(id));
  sel.clear(); if (!all) listIds.forEach(id => sel.add(id));
  renderList();
};
$("list").addEventListener("click", e => {
  const c = e.target.closest("[data-sel]");
  if (c) {
    const id = Number(c.dataset.sel), box = c.querySelector("input");
    if (e.target !== box) box.checked = !box.checked;
    box.checked ? sel.add(id) : sel.delete(id);
    updateSel(); return;
  }
  const b = e.target.closest("[data-open]"); if (b) openDetail(Number(b.dataset.open));
});
$("dClose").onclick = closeDetail;
$("detail").addEventListener("click", e => { if (e.target === $("detail")) closeDetail(); });
$("dEdit").onclick = async () => { const r = await detailRec(); if (r) editRec(r); };
$("dCopy").onclick = async () => { const r = await detailRec(); if (r) { closeDetail(); copyRec(r); } };
$("dDel").onclick = async () => {
  const r = await detailRec(); if (!r) return;
  if (!confirm(T("删除这条记录？删除后不能恢复。"))) return;
  await delRec(r.id); closeDetail(); renderList(); refreshCount(); refreshModelPhotos();
  if (editingId === r.id) leaveEdit();
};
$("editCancel").onclick = () => { leaveEdit(); document.querySelector('#tabs [data-tab="list"]').click(); };
$("clearDone").onclick = async () => {
  const done = (await allRecs()).filter(r => r.exported);
  if (!done.length) { toast("没有已导出的记录"); return; }
  if (!confirm(T(`删除已导出的 ${done.length} 条记录（含照片）？删除后不能恢复。`))) return;
  for (const r of done) await delRec(r.id);
  renderList(); refreshCount(); refreshModelPhotos();
};

try { const m = localStorage.getItem("keepMode"); if (m) $("keepMode").value = m; } catch {}
$("langBtn").onclick = () => {
  snapshotForm();
  lang = lang === "vi" ? "zh" : "vi";
  try { localStorage.setItem("lang", lang); } catch {}
  closeDetail();
  renderForm();
  applyLang();
  refreshMapLang();
  if (!$("pageList").classList.contains("hidden")) renderList();
};
renderTypes(); renderForm(); refreshCount(); refreshModelPhotos(); applyLang(); setupMap();
refreshStockCount(); refreshStockChips();
if (!window.isSecureContext) $("insecureBar").classList.remove("hidden");
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
