<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="物品采集">
<title>物品采集</title>
<style>
:root { --bg:#f4f6fa; --card:#fff; --text:#1c2333; --sub:#667085; --line:#d8dee9; --main:#1f6feb; --danger:#d92d20; --ok:#12805c; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#12151c; --card:#1b2029; --text:#e6e9f0; --sub:#98a2b3; --line:#2f3745; --main:#4c8dff; --danger:#f97066; --ok:#3ccb92; }
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,"Microsoft YaHei",sans-serif; padding-bottom:calc(84px + env(safe-area-inset-bottom)); }
header { position:sticky; top:0; z-index:5; background:var(--main); color:#fff; padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top)); display:flex; align-items:center; justify-content:space-between; }
header h1 { font-size:18px; margin:0; }
header span { font-size:13px; opacity:.9; }
main { padding:12px 16px; max-width:640px; margin:0 auto; }
.seg { display:flex; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:12px; }
.seg button { flex:1; border:0; background:none; color:var(--text); padding:11px 4px; font-size:15px; }
.seg button.on { background:var(--main); color:#fff; font-weight:600; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
label { display:block; font-size:13px; color:var(--sub); margin:10px 0 4px; }
label:first-child { margin-top:0; }
label b { color:var(--danger); }
input, select, textarea { width:100%; font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; }
textarea { min-height:64px; resize:vertical; }
.hint { font-size:12px; color:var(--sub); margin-top:4px; }
.photo { display:flex; gap:12px; align-items:center; }
.photo .pv { width:96px; height:96px; border-radius:10px; background:var(--bg); border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:12px; overflow:hidden; flex:none; }
.photo .pv img { width:100%; height:100%; object-fit:cover; }
.btn { display:inline-block; border:0; border-radius:10px; padding:12px 16px; font-size:16px; background:var(--main); color:#fff; }
.btn.ghost { background:none; color:var(--main); border:1px solid var(--main); }
.btn.danger { background:none; color:var(--danger); border:1px solid var(--danger); }
.btn.block { width:100%; }
.row { display:flex; gap:8px; }
.row > * { flex:1; }
.keep { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:14px; color:var(--sub); }
.keep input { width:auto; }
.bar { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px; z-index:6; }
.bar .btn { flex:1; }
#list { padding:4px 12px; }
.item { display:flex; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); cursor:pointer; }
.item:last-child { border-bottom:0; }
.selbar { display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:12px; color:var(--sub); }
.selbar .btn { padding:6px 14px; font-size:14px; flex:none; }
.ck { flex:none; display:flex; align-items:center; justify-content:center; width:32px; height:40px; }
.ck input { width:20px; height:20px; margin:0; }
.item:active { background:var(--bg); }
.item img, .item .ph { width:40px; height:40px; border-radius:6px; object-fit:cover; background:var(--bg); flex:none; }
.item img.shared { opacity:.55; }
.item .t { flex:1; min-width:0; line-height:1.3; }
.item .t div { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item .t .n { font-size:14px; }
.item .t .s { font-size:12px; color:var(--sub); }
.item .t .s.code { color:var(--text); }
.item .when { flex:none; font-size:11px; color:var(--sub); text-align:right; line-height:1.3; }
.tag { font-size:10px; padding:0 5px; border-radius:5px; background:var(--bg); border:1px solid var(--line); color:var(--sub); margin-right:4px; }
.tag.done { color:var(--ok); border-color:var(--ok); }
.editbar { display:flex; align-items:center; justify-content:space-between; gap:8px; background:#fff7e0; color:#7a5200; border:1px solid #f0d58a; border-radius:10px; padding:8px 12px; margin-bottom:12px; font-size:14px; }
.editbar .btn { padding:6px 12px; font-size:14px; background:#fff; }
.dsheet { max-height:90vh; overflow:auto; }
.dhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.dhead h2 { margin:0; font-size:16px; }
.dgrid { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:14px; }
.dgrid .k { color:var(--sub); white-space:nowrap; }
.dgrid .v { word-break:break-all; }
.dphotos { display:flex; gap:8px; margin:8px 0; flex-wrap:wrap; }
.dphotos figure { margin:0; text-align:center; font-size:11px; color:var(--sub); }
.dphotos img { width:96px; height:96px; object-fit:cover; border-radius:8px; display:block; }
.dbtns { display:flex; gap:8px; margin-top:12px; }
.dbtns .btn { flex:1; padding:10px 4px; font-size:15px; }
.empty { text-align:center; color:var(--sub); padding:32px 0; }
.toast { position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#101828; color:#fff; padding:10px 16px; border-radius:20px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:9; max-width:90%; }
.toast.show { opacity:1; }
.hidden { display:none !important; }
.place { border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--bg); }
.place .row { margin-bottom:8px; }
.place .seg { margin-bottom:8px; background:var(--card); }
.place .seg button { padding:8px 4px; }
.row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.place input, .place select { background:var(--card); }
.place .cascade select { margin-bottom:8px; }
.mapv { position:fixed; inset:0; z-index:25; background:var(--bg); display:flex; flex-direction:column; }
.mapv .top { display:flex; align-items:center; gap:8px; padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top)); background:var(--main); color:#fff; }
.mapv .top b { flex:1; font-size:15px; }
.mapv .top button { border:0; background:rgba(255,255,255,.2); color:#fff; border-radius:8px; padding:6px 12px; font-size:14px; }
#mapPickHost { flex:1; min-height:0; display:flex; flex-direction:column; }
#mapBody { flex:1; min-height:0; display:flex; flex-direction:column; position:relative; }
.mb-search { position:relative; padding:8px 10px 0; }
.mb-search input { padding:9px 10px; }
.mb-res { position:absolute; left:10px; right:10px; top:100%; z-index:8; max-height:55vh; overflow:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.28); }
.mb-res .g { padding:5px 12px; font-size:12px; color:var(--sub); background:var(--bg); position:sticky; top:0; }
.mb-res .r { padding:8px 12px; border-bottom:1px solid var(--line); font-size:14px; }
.mb-res .r:last-child { border-bottom:0; }
.mb-res .r:active { background:var(--bg); }
.mb-res .r small { display:block; color:var(--sub); font-size:12px; }
#mapBody .tabs { display:flex; gap:6px; padding:8px 10px 0; overflow-x:auto; flex:none; }
#mapBody .tabs button { flex:none; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; padding:6px 12px; font-size:14px; }
#mapBody .tabs button small { opacity:.65; margin-left:2px; }
#mapBody .tabs button.on { background:var(--main); color:#fff; border-color:var(--main); }
#mapBody .mvinfo { padding:6px 12px; font-size:12px; color:var(--sub); flex:none; }
#mapBody .mvinfo b { color:var(--text); }
#mvView { position:relative; flex:1; min-height:0; overflow:hidden; background:#0f1520; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; }
#mvStage { position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }
#mvStage img { display:block; max-width:none; -webkit-user-drag:none; pointer-events:none; }
#mvMarks { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.mk { position:absolute; box-sizing:border-box; border:2px solid #ffb020; background:rgba(255,176,32,.2); border-radius:3px; overflow:hidden; display:flex; align-items:center; justify-content:center; text-align:center; color:#fff; font-size:12px; font-weight:600; line-height:1.15; text-shadow:0 0 3px #000,0 0 3px #000,0 0 2px #000; }
.mk span { max-width:100%; max-height:100%; overflow:hidden; padding:1px 2px; word-break:break-all; }
.mk.v span { writing-mode:vertical-rl; }
.mk.nolabel span { display:none; }
.mk.hot { border-color:#ff3c3c; background:rgba(255,60,60,.4); z-index:2; }
.mk.sel { border-color:#5b8cff; background:rgba(36,99,235,.45); z-index:3; }
.mv-tag { position:absolute; z-index:4; pointer-events:none; background:rgba(16,24,40,.92); color:#fff; border-radius:6px; padding:2px 8px; font-size:13px; white-space:nowrap; max-width:80%; overflow:hidden; text-overflow:ellipsis; }
.mv-ctl { position:absolute; right:10px; bottom:12px; display:flex; flex-direction:column; gap:6px; z-index:5; }
.mv-ctl button { width:42px; height:42px; border:0; border-radius:10px; background:rgba(20,26,38,.85); color:#fff; font-size:20px; }
.mv-ctl button.off { opacity:.45; }
.mb-sheet { flex:none; max-height:34%; overflow:auto; background:var(--card); border-top:1px solid var(--line); padding:10px 12px; font-size:14px; }
.mb-sheet .nm { font-size:16px; font-weight:600; }
.mb-sheet .pth { font-family:ui-monospace,Menlo,Consolas,monospace; color:var(--sub); font-size:13px; }
.mb-sheet .hint { margin-top:2px; }
.mb-sheet .chips2 span { display:inline-block; border:1px solid var(--line); border-radius:12px; padding:1px 8px; margin:4px 4px 0 0; font-size:12px; }
.mb-sheet .btns { display:flex; gap:8px; margin-top:8px; }
.mb-sheet .btns .btn { flex:1; padding:9px; font-size:14px; }
#mapBody .foot { flex:none; display:flex; gap:8px; padding:8px 12px calc(8px + env(safe-area-inset-bottom)); background:var(--card); border-top:1px solid var(--line); }
#mapBody .foot .btn { padding:10px 14px; font-size:15px; }
#mapBody .foot .btn[disabled] { opacity:.4; }
#mapBody .foot .grow { flex:1; }
.more { margin-top:12px; border-top:1px dashed var(--line); padding-top:10px; }
.more summary { color:var(--main); font-size:14px; padding:6px 0; }
.withscan { display:flex; gap:8px; }
.withscan input { flex:1; min-width:0; }
.scanbtn { flex:none; border:1px solid var(--main); background:none; color:var(--main); border-radius:8px; padding:0 14px; font-size:15px; }
.scan { position:fixed; inset:0; z-index:30; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#fff; }
.scan video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.scan .frame { position:relative; width:92vw; max-width:560px; height:64vw; max-height:380px; border:3px solid #4c8dff; border-radius:12px; box-shadow:0 0 0 100vmax rgba(0,0,0,.45); }
.scan p, .scan .btn { position:relative; margin:0; }
.scan .btn { background:#fff; color:#111; }
#camSwap { position:relative; background:rgba(0,0,0,.45); color:#fff; border:1px solid rgba(255,255,255,.7); border-radius:16px; padding:6px 14px; font-size:15px; }
.mask { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
.sheet { background:var(--card); width:100%; max-width:640px; border-radius:16px 16px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); }
.sheet h2 { margin:0 0 4px; font-size:17px; }
.sheet p { margin:0 0 14px; color:var(--sub); font-size:14px; }
.sheet .btn { margin-top:8px; }
/* ---- 紧凑布局：覆盖前面的尺寸 ---- */
body { font-size:14px; line-height:1.3; padding-bottom:calc(56px + env(safe-area-inset-bottom)); }
header { padding:7px 12px; padding-top:calc(7px + env(safe-area-inset-top)); }
header h1 { font-size:16px; }
header span { font-size:12px; }
main { padding:8px 10px; }
.seg { margin-bottom:8px; border-radius:8px; }
.seg button { padding:7px 4px; font-size:14px; }
.card { padding:8px 10px; margin-bottom:8px; border-radius:10px; }
#fields { display:grid; grid-template-columns:1fr 1fr; column-gap:8px; }
#fields .f { grid-column:span 2; min-width:0; }
#fields .f.half { grid-column:span 1; }
#fields details.more { grid-column:span 2; display:grid; grid-template-columns:1fr 1fr; column-gap:8px; margin-top:6px; padding-top:4px; }
details.more > summary { grid-column:span 2; font-size:13px; padding:4px 0; }
label { font-size:12px; margin:6px 0 2px; }
input, select, textarea { font-size:14px; padding:5px 8px; border-radius:6px; min-height:32px; }
textarea { min-height:40px; }
.hint { font-size:11px; margin-top:2px; }
.btn { padding:8px 12px; font-size:15px; border-radius:8px; }
.bar { padding:6px 10px calc(6px + env(safe-area-inset-bottom)); gap:6px; }
.place { padding:6px; border-radius:8px; }
.place .row { margin-bottom:6px; gap:6px; }
.place .seg { margin-bottom:6px; }
.place .seg button { padding:5px 4px; }
.row3 { gap:6px; }
.withscan { gap:6px; }
.scanbtn { padding:0 10px; font-size:14px; border-radius:6px; }
.editbar { padding:5px 10px; margin-bottom:8px; font-size:13px; }
.ptiles { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; align-items:flex-start; }
#xphotos { display:contents; }
.ptile { width:64px; text-align:center; }
.plabel { font-size:11px; color:var(--sub); white-space:nowrap; margin-bottom:2px; }
.plabel b { color:var(--danger); }
.ptile .pv { width:64px; height:64px; border-radius:8px; background:var(--bg); border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:11px; overflow:hidden; }
.ptile .pv img { width:100%; height:100%; object-fit:cover; cursor:zoom-in; }
.pbtn { margin-top:3px; border:1px solid var(--main); background:none; color:var(--main); border-radius:6px; font-size:12px; padding:2px 0; width:100%; }
.lb { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.92); display:flex; align-items:center; justify-content:center; }
.lb img { max-width:100%; max-height:100%; object-fit:contain; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.chip { border:1px solid var(--line); background:var(--bg); color:var(--text); border-radius:14px; padding:4px 12px; font-size:12px; }
/* ---- 库位选择：一个格子，点开向下钻取 ---- */
.pbox { display:block; width:100%; height:40px; text-align:left; padding:15px 24px 3px 8px; font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pbox::after { content:"▾"; position:absolute; right:9px; top:8px; color:var(--sub); font-size:18px; line-height:1; }
.pwin { margin:3px 0 4px; max-height:112px; overflow-y:auto; border:1px solid var(--line); border-radius:6px; background:var(--bg); padding:5px; }
.pwin .chips { margin:0; }
.pwin .chip { padding:6px 12px; font-size:14px; }
.pwin .chip.act { color:var(--main); border-color:var(--main); }
.pwin .none { color:var(--sub); font-size:13px; }
/* 模房的「物品」= 照片卡片：先拍照，再点一下类型，选库位（页面里的编号 / 名称 / 数量都不用写） */
.card.photo-first { display:flex; flex-direction:column; }
.card.photo-first .ptiles { order:-1; justify-content:center; margin:2px 0 8px; }
.card.photo-first #photoHint { order:-1; }
.card.photo-first .ptile { width:200px; }
.card.photo-first .ptile .pv { width:200px; height:150px; border-radius:10px; font-size:14px; }
.card.photo-first .ptile .pv img { object-fit:contain; }
.card.photo-first .pbtn { font-size:16px; padding:8px 0; background:var(--main); color:#fff; }
.cchips { display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 8px; }
.cchips .cc { border:1px solid var(--line); background:var(--bg); color:var(--text); border-radius:18px; padding:8px 16px; font-size:16px; }
.cchips .cc.on { background:var(--main); border-color:var(--main); color:#fff; font-weight:600; }
.cchips .cc.add { color:var(--main); border-style:dashed; }
.clabel { font-size:13px; color:var(--sub); margin-top:4px; }
.clabel b { color:var(--danger); }
#roomMenu { position:absolute; left:10px; top:100%; z-index:8; margin-top:-6px; background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:0 4px 14px rgba(0,0,0,.18); overflow:hidden; min-width:150px; }
#roomMenu button { display:block; width:100%; border:0; background:none; color:var(--text); text-align:left; padding:10px 14px; font-size:15px; }
#roomMenu button.on { color:var(--main); font-weight:600; }
#roomMenu button + button { border-top:1px solid var(--line); }
.parts .fl { margin-top:4px; }
input[readonly] { background:var(--line); color:var(--sub); }
#list { padding:2px 10px; }
.item { padding:4px 0; gap:8px; }
.item img, .item .ph { width:34px; height:34px; border-radius:5px; }
.item .t .n { font-size:13px; }
.item .t .s { font-size:11px; }
.dphotos img { width:64px; height:64px; cursor:zoom-in; }
.dphotos { gap:6px; margin:6px 0; }
.dgrid { font-size:13px; gap:2px 10px; }
.sheet { padding:12px 12px calc(12px + env(safe-area-inset-bottom)); }
.dbtns .btn { padding:8px 4px; font-size:14px; }
.toast { bottom:calc(64px + env(safe-area-inset-bottom)); font-size:13px; padding:8px 14px; }

/* ---- 名称写在格子里 ---- */
#fields .f { margin-bottom:6px; }
.fl { display:flex; gap:6px; }
.fl .box { position:relative; flex:1; min-width:0; }
.fl input, .fl select, .fl textarea { height:40px; min-height:0; padding:15px 8px 3px; }
.fl textarea { height:58px; padding-top:17px; }
.fl select { padding-right:20px; }
.fl label { position:absolute; left:9px; top:10px; margin:0; font-size:14px; color:var(--sub); pointer-events:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:calc(100% - 24px); transition:top .1s, font-size .1s; }
.fl .box.filled label, .fl .box:focus-within label { top:2px; font-size:10px; }
.fl label b { color:var(--danger); }
.fl label .tip { opacity:.7; }
.fl label .tip::before { content:" · "; }
.fl input::placeholder, .fl textarea::placeholder { color:transparent; }
.fl .box:focus-within input::placeholder { color:var(--sub); opacity:.7; }
.scanbtn { height:40px; }
.ptitle { font-size:11px; color:var(--sub); margin-bottom:4px; }
.ptitle b { color:var(--danger); }
header .hr, header .hl { display:flex; align-items:center; gap:8px; }
#updBtn { background:rgba(255,255,255,.2); color:#fff; border:1px solid rgba(255,255,255,.65); border-radius:12px; padding:2px 10px; font-size:12px; }
#updBtn.new { background:#fff; color:var(--main); font-weight:600; }
#langBtn { background:rgba(255,255,255,.2); color:#fff; border:1px solid rgba(255,255,255,.65); border-radius:12px; padding:2px 10px; font-size:12px; }

/* ---- 操作按钮放顶部 ---- */
.top { position:sticky; top:0; z-index:6; }
.top header { position:static; }
.top .bar { position:static; border-top:0; border-bottom:1px solid var(--line); padding:6px 10px; }
.toast { bottom:auto; top:calc(104px + env(safe-area-inset-top)); }

/* ---- 整体布局：顶部固定，中间表单框内滚动，底部是按钮 ---- */
html, body { height:100%; }
body { display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden; padding:0; }
.top { position:relative; flex:none; }
.top #tabs { margin:6px 10px 0; }
main#main { flex:1; min-height:0; width:100%; max-width:640px; margin:0 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:8px 10px; }
.bar { position:static; flex:none; border-top:1px solid var(--line); border-bottom:0; padding:6px 10px calc(6px + env(safe-area-inset-bottom)); width:100%; max-width:640px; margin:0 auto; }
.bar #save { flex:1.6; }
.toast { top:calc(104px + env(safe-area-inset-top)); }
</style>

<script>
"use strict";

// ---- 字段定义：表头与电脑端导入模板一致，导入时能直接识别 ----------------------------
// 类别 / 单位的可选项与电脑端「数据标准化」的预设一致；电脑端加了新类别，这里也要同步加
const ITEM_CATEGORIES = ["治具", "五金", "电气", "气动", "ESD", "工具", "量具", "耗材", "配件", "劳保", "包材", "其他"];
const UNITS = ["件", "个", "套", "对", "双", "把", "根", "条", "张", "台", "盒", "包", "卷", "米", "箱", "瓶"];
const EQUIPMENT_CATEGORIES = ["设备", "测试", "其他"];
const CARD_CATEGORIES = ["加工件", "电源", ...ITEM_CATEGORIES];      // 模房的物品按「类型」找；这里没有的类型点「＋ 新类型」自己加，电脑端导入时会自动加进类别列表
const TEST_CATEGORY = "测试";          // 选了这个类别，必须填校准信息

const TYPES = {
  // 字段顺序、表头与电脑端导入模板一致；more = 放进「更多信息」折叠区；when = 满足条件才显示
  // fields 的顺序 = 导出表格的列顺序（与导入模板一致）；layout = 录入页上的显示顺序，把相关的项放在一起
  item: { label: "物品",
    layout: ["物品编号", "物品名称", "规格", "类别", "单位", "初始库存", "库位", "状态", "低库存提醒", "备注", "越南文名称"],
    fields: [
    { k: "物品编号", hint: "留空自动生成" },
    { k: "物品名称", req: true },
    { k: "越南文名称", more: true },
    { k: "规格" },
    { k: "类别", opts: ITEM_CATEGORIES, req: true, keep: true },
    { k: "单位", opts: UNITS, keep: true },
    { k: "低库存提醒", type: "number", hint: "0=不提醒", more: true },
    { k: "库位", place: "shelf", req: true, keep: true },
    { k: "初始库存", type: "number", req: true, hint: "这个库位放了多少，没有写 0" },
    { k: "状态", opts: ["正常", "损坏", "停用"], keep: true },
    { k: "备注", area: true },
  ]},
  // 模房的物品 = 照片卡片：拍一张照片 + 类型 + 库位，不记数量，名字可以不写（电脑端用类型当名字）；导出时和端子、其他房间的物品共用「物品」表
  card: { label: "物品", table: "物品", cardLike: true,
    layout: ["类别", "库位", "备注", "物品名称", "越南文名称", "物品编号"],
    fields: [
    { k: "物品编号", hidden: true },                                  // 留空，电脑端自动生成
    { k: "物品名称", more: true, hint: "不写就用类型" },
    { k: "越南文名称", more: true },
    { k: "类别", label: "类型", chips: CARD_CATEGORIES, req: true, keep: true },
    { k: "库位", place: "shelf", req: true, keep: true },
    { k: "备注", area: true, hint: "选填" },
  ]},
  terminal: { label: "端子", table: "物品", noPhoto: true,     // 端子没有照片和条码：规格（端子料号）就是编号；和物品录进同一张表
    layout: ["规格", "物品名称", "初始库存", "库位", "类别", "单位", "状态", "低库存提醒", "备注", "越南文名称"],
    fields: [
    { k: "物品编号", hidden: true },                                  // 保存时自动 = 规格
    { k: "物品名称", def: "端子", locked: true },                     // 端子名称固定，不能改（电脑端靠名称里的「端子」认出它）
    { k: "越南文名称", more: true },
    { k: "规格", label: "端子料号", req: true, scan: true, plus: true, hint: "也是它的编号，如 M509200320；右边「＋」可加适用料号" },
    { k: "适用产品料号", parts: true, hidden: true },                    // 不单独占一行：点料号右边的「＋」，一个适用料号一格；导出时用空格连起来
    { k: "类别", opts: ITEM_CATEGORIES, def: "治具", keep: true, more: true },
    { k: "单位", opts: UNITS, def: "个", keep: true, more: true },
    { k: "低库存提醒", type: "number", hint: "0=不提醒", more: true },
    { k: "库位", place: "shelf", req: true, keep: true },
    { k: "初始库存", label: "数量", type: "number", req: true, hint: "这个库位放了多少，没有写 0" },
    { k: "状态", opts: ["正常", "损坏", "停用"], def: "正常", keep: true, more: true },
    { k: "备注", area: true, more: true },
  ]},
  fixture: { label: "治具",
    layout: ["治具编号", "资产编号", "位置", "状态", "越南文名称", "厂商", "贴标位置", "备注"],
    fields: [
    // 治具只留常用的几项在前面，其余收进「更多信息」；不填名称和类别：电脑端按编号去 MES 治具清单里对
    { k: "治具编号", req: true },
    { k: "资产编号" },
    { k: "越南文名称", more: true },
    { k: "厂商", more: true },
    { k: "位置", place: "shelf", req: true, keep: true },
    { k: "状态", opts: ["在库", "已出库", "维修中", "损坏", "停用", "报废"], def: "在库", keep: true },
    { k: "贴标位置", more: true },
    { k: "备注", area: true, more: true },
  ], extraPhotos: ["资产编号照片"] },
  equipment: { label: "设备",
    // 各种编号放在最前面；类别后面紧跟它触发的校准项；位置、状态、状况放一起
    layout: ["设备编号", "资产编号", "出厂编号", "标签编号", "设备名称", "型号", "厂商", "类别", "校准时间", "下次校准时间", "校验人",
             "位置", "状态", "设备状况", "缺少配件", "备注", "越南文名称", "设备功率", "设备电压", "设备重量", "出厂时间", "使用年限", "贴标位置"],
    fields: [
    { k: "设备编号", hint: "留空自动生成" },
    { k: "设备名称", req: true },
    { k: "越南文名称", more: true },
    { k: "型号", req: true },
    { k: "厂商" },
    { k: "资产编号" },
    { k: "类别", opts: EQUIPMENT_CATEGORIES, req: true, keep: true },
    { k: "位置", place: "line", req: true, keep: true },
    { k: "状态", opts: ["在库", "使用中", "待维修", "维修中", "报废", "损坏", "停用"], keep: true },
    { k: "出厂编号", hint: "铭牌序列号，可以重复" },
    { k: "设备功率", more: true, ph: "带单位，如 1.5kW" },
    { k: "设备电压", more: true, ph: "带单位，如 220V" },
    { k: "设备重量", more: true, ph: "带单位，如 30kg" },
    { k: "出厂时间", type: "date", more: true },
    { k: "使用年限", more: true, ph: "如 5年" },
    { k: "校准时间", type: "date", when: { k: "类别", v: TEST_CATEGORY } },
    { k: "下次校准时间", type: "date", when: { k: "类别", v: TEST_CATEGORY }, hint: "须晚于校准时间" },
    { k: "校验人", when: { k: "类别", v: TEST_CATEGORY } },
    { k: "设备状况", opts: ["正常", "故障", "缺配件"], keep: true },
    { k: "缺少配件", when: { k: "设备状况", v: "缺配件" } },
    { k: "贴标位置", more: true },
    { k: "标签编号", more: true, hint: "手持终端绑定用，可不填" },
    { k: "备注", area: true },
  ], extraPhotos: ["设备标签照片", "资产标签照片", "铭牌照片"] },      // 只在设备详情里显示，选填
};
const PHOTO_COL = "照片";
// 旧版草稿里设备标签照片叫「标签照片」，读取时当作「设备标签照片」
const xget = (r, k) => r.extra && (r.extra[k] || (k === "设备标签照片" ? r.extra["标签照片"] : undefined));

// ---- 位置：统一写成  栋-楼层-产线  或  栋-楼层-区-层-格，与仓库系统的位置库写法一致 ----------
//   货架：V3-2F-M-3-1（3栋 2楼 M区 3层 1格）      产线：V3-2F-FHA-01（3栋 2楼 产线 FHA-01）
const BUILDINGS = [1, 2, 3, 4, 5, 6];
const FLOORS = [1, 2, 3, 4, 5, 6];
const ZONES = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const opt = (v, label, cur) => `<option value="${v}"${String(v) === String(cur) ? " selected" : ""}>${label}</option>`;

// ---- 位置库：电脑端导出的位置树（locations.js，[编号, 短写法, 名称, 上级编号, 深度]），一级一级选 ------------
// 树是空的（还没导出过）就退回上面的「栋/层/区/排/格」手填。每一级最后一项是「＋新增」，加的位置存在本机，
// 记录里照常写成短写法（如 V1-1F-B-2-02）；电脑端导入后，不在库里的会进「位置对照」处理。
let TREE = null;
const unpad = p => String(p || "").replace(/(?<=-)0+(\d)/g, "$1");
const loadExtra = () => { try { return JSON.parse(localStorage.getItem("libExtra") || "[]"); } catch { return []; } };
function buildTree() {
  const nodes = (window.LOCATIONS || []).map(r => ({ code: r[0], path: r[1], name: r[2], parent_code: r[3], depth: r[4], name_vi: r[5] || "" }));
  const codes = new Set(nodes.map(n => n.code)), paths = new Set(nodes.map(n => n.path));
  for (const n of loadExtra()) {            // 手机上自己加的；电脑端位置库里已经有同名的就用库里的
    if (paths.has(n.path) || codes.has(n.code) || !codes.has(n.parent_code)) continue;
    nodes.push(n); codes.add(n.code); paths.add(n.path);
  }
  TREE = null;
  if (!nodes.length) return;
  const byCode = new Map(nodes.map(n => [n.code, n]));
  const byPath = new Map(nodes.map(n => [n.path, n]));
  const byUnpadded = new Map(nodes.map(n => [unpad(n.path), n]));
  const children = new Map();
  for (const n of nodes) {
    const parent = byCode.has(n.parent_code) ? n.parent_code : "";
    if (!children.has(parent)) children.set(parent, []);
    children.get(parent).push(n);
  }
  for (const list of children.values()) list.sort((x, y) => String(x.path).localeCompare(String(y.path), undefined, { numeric: true }));
  const roots = children.get("") || [];      // 最上面只有一个厂区（AVC(VN)）就不用选，从下一级开始
  const start = roots.length === 1 && roots[0].depth === 1 && children.has(roots[0].code) ? roots[0].code : "";
  TREE = { byCode, byPath, byUnpadded, children, start };
}
buildTree();
const findNode = v => TREE ? TREE.byPath.get(v) || TREE.byUnpadded.get(unpad(v)) : null;
// 跟电脑端位置库同一套缩写：1栋→V1，2楼→2F，B区→B，2排→2，06格→06
function compactSegment(text) {
  text = text.trim();
  let m = /^(\d+)\s*栋$/.exec(text); if (m) return "V" + m[1];
  m = /^([A-Za-z]?\d+)\s*楼$/.exec(text); if (m) return m[1] + "F";
  m = /^(.+?)\s*(?:区|排|格|柜|层|架|位)$/.exec(text);
  return m ? m[1].trim() : text;
}
function libLabel(node, parent) {
  const short = parent && node.path.startsWith(parent.path + "-") ? node.path.slice(parent.path.length + 1) : node.path;
  const name = lang === "vi" ? (node.name_vi || node.name) : node.name;      // 越南文名称（电脑端位置库里翻译好的）
  return name && name !== short ? `${short} · ${name}` : short;
}
// 库位：一个格子（没选时是大字标签，选了以后标签缩成小字在上、选中的路径在下），右边「←」回退一级；
// 格子下面是下一级的选项窗口（可滚动）：选一个，格子里就是它、窗口换成它的下一级；走到最下一级窗口自动收起，点格子再展开。
const MOLD_PLACE = "V3-2F-模房";
const placeOpen = {};                    // 格子下面的选项窗口是不是展开着（按格子前缀）
function libPlaceHtml(f, s, pre) {
  let cur = s.lib;
  if (cur === undefined && s.b) {           // 旧版存的「栋/层/区/排/格」：换成新的短写法
    const tail = s.mode === "shelf" ? [s.z, +s.r, +s.l].join("-") : String(s.n || "").toUpperCase();
    cur = `V${s.b}-${s.f}F-${tail}`;
  }
  const node = findNode(cur || ""), path = node && node.code !== TREE.start ? node.path : "";
  return `<div class="fl" id="${pre}_place"><div class="box">
    <input type="hidden" id="${pre}_lib" value="${safe(path)}">
    <button type="button" class="pbox" id="${pre}_open" data-place-toggle="${pre}"><span data-raw>${safe(path)}</span></button>
    <label for="${pre}_open">${f.k}${f.req ? " <b>*</b>" : ""}${f.hint ? `<span class="tip">${f.hint}</span>` : ""}</label>
  </div><button type="button" class="scanbtn" id="${pre}_back" data-place-back="${pre}">←</button></div>
  <div class="pwin hidden" id="${pre}_win"></div>`;
}
function placeNode(pre) {
  const node = findNode($(`${pre}_lib`).value);
  return node && node.code !== TREE.start ? node : null;
}
function setPlace(pre, path) {
  const node = findNode(path), lib = node && node.code !== TREE.start ? node.path : "";
  $(`${pre}_lib`).value = lib;
  $(`${pre}_open`).firstElementChild.textContent = lib;
  syncFilled();
}
// 画格子下面的窗口：当前这一级的选项（open 为假就收起）
function paintPlaceWin(pre, open) {
  const win = $(`${pre}_win`); if (!win || !TREE) return;
  placeOpen[pre] = open;
  const node = placeNode(pre);
  $(`${pre}_back`).disabled = !node;
  win.classList.toggle("hidden", !open);
  if (!open) return;
  const code = node ? node.code : TREE.start, parent = TREE.byCode.get(code);
  const kids = (TREE.children.get(code) || []).map(k => `<button type="button" class="chip" data-raw data-place-pick="${pre}|${safe(k.code)}">${safe(libLabel(k, parent))}</button>`).join("");
  win.innerHTML = `<div class="chips">${kids}${node ? `<button type="button" class="chip act" data-place-new="${pre}">＋ 新增…</button>` : ""}${MAPS.length ? `<button type="button" class="chip act" data-place-map="${pre}">在地图上选</button>` : ""}</div>`;
  win.scrollTop = 0;
}
// 下面没有东西、也不是楼层 = 最下一级
const isLeafNode = node => !(TREE.children.get(node.code) || []).length && !/^\d+F$/i.test(node.path.split("-").pop());
function setupPicker() {

// pre：位置选择器的 id 前缀（录入页用 p_）
function placeHtml(f, v, pre = "p") {

  return `<div class="place" id="${pre}_place">

    <div class="row">
      <select id="${pre}_b"><option value="">楼栋</option>${BUILDINGS.map(n => opt(n, n + "栋", s.b)).join("")}</select>
      <select id="${pre}_f"><option value="">楼层</option>${FLOORS.map(n => opt(n, n + "楼", s.f)).join("")}</select>
    </div>
    <div class="seg mini" id="${pre}_mode" data-mode="${mode}">
      <button type="button" data-m="shelf" class="${mode === "shelf" ? "on" : ""}">货架</button>
      <button type="button" data-m="line" class="${mode === "line" ? "on" : ""}">产线</button>
    </div>
    <div class="row3${mode === "shelf" ? "" : " hidden"}" id="${pre}_shelf">
      <select id="${pre}_z"><option value="">区</option>${ZONES.map(z => opt(z, z + "区", s.z)).join("")}</select>
      <input id="${pre}_r" type="number" inputmode="numeric" min="1" max="99" placeholder="层" value="${safe(s.r || "")}">
      <input id="${pre}_l" type="number" inputmode="numeric" min="1" max="99" placeholder="格" value="${safe(s.l || "")}">
    </div>
    <div id="${pre}_line"${mode === "line" ? "" : ' class="hidden"'}>
      <input id="${pre}_n" placeholder="产线，如 FHA-01" value="${safe(s.n || "")}" autocapitalize="characters" autocomplete="off">
    </div>
    <div class="hint" id="${pre}_view"></div>
  </div>`;
}
function placeState(pre = "p") {
  const g = id => ($(id) ? $(id).value.trim() : "");
  if (TREE) return { lib: g(`${pre}_lib`) };
  return { b: g(`${pre}_b`), f: g(`${pre}_f`), mode: $(`${pre}_mode`).dataset.mode, z: g(`${pre}_z`), r: g(`${pre}_r`), l: g(`${pre}_l`), n: g(`${pre}_n`) };
}
// 全空 = 没填位置；填一部分就必须填完整
function placeValue(s) {
  if (TREE) {
    if (!s.lib) return { value: "" };
    const node = findNode(s.lib);
    if (!node || !/^V\d+-\d+F/i.test(node.path)) return { error: "请选择楼层" };   // 至少要到「栋-楼层」（楼层在哪一级看库，所以看写法）
    return { value: node.path };
  }
  const shelf = s.mode === "shelf";
  const parts = shelf ? [s.z, s.r, s.l] : [s.n];
  if (!s.b && !s.f && parts.every(x => !x)) return { value: "" };
  if (!s.b) return { error: "请选择楼栋" };
  if (!s.f) return { error: "请选择楼层" };
  if (shelf) {
    if (!s.z) return { error: "请选择货架的区" };
    if (!/^\d+$/.test(s.r) || +s.r < 1) return { error: "请填货架的层（数字）" };
    if (!/^\d+$/.test(s.l) || +s.l < 1) return { error: "请填货架的格（数字）" };
    return { value: `V${s.b}-${s.f}F-${s.z}-${+s.r}-${+s.l}` };
  }
  const line = s.n.toUpperCase().replace(/\s+/g, "");
  if (!/^[A-Z0-9][A-Z0-9-]*$/.test(line)) return { error: "产线只能写字母、数字和横线，如 FHA-01" };
  return { value: `V${s.b}-${s.f}F-${line}` };
}
function updatePlaceView(pre = "p") {
  const el = $(`${pre}_view`); if (!el) return;
  const r = placeValue(placeState(pre));
  el.textContent = r.value ? `将记录为：${r.value}` : (r.error ? "" : "未填位置");
}

// ---- IndexedDB ------------------------------------------------------------------------
let dbp = null;
function db() {
  if (!dbp) dbp = new Promise((ok, no) => {
    const r = indexedDB.open("collector", 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains("records")) d.createObjectStore("records", { keyPath: "id", autoIncrement: true });
    };
    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
  });
  return dbp;
}
async function tx(store, mode, fn) {
  const d = await db();
  return new Promise((ok, no) => {
    const t = d.transaction(store, mode);
    const res = fn(t.objectStore(store));
    t.oncomplete = () => ok(res && res.result);
    t.onerror = () => no(t.error);
  });
}
// iPhone 的 Safari（尤其「添加到主屏幕」后）直接把 Blob 存进 IndexedDB 不可靠，保存会悄悄失败、
// 界面却什么反应都没有：存之前转成 ArrayBuffer，读出来再转回 Blob，其它代码不用管这层。
const packBlob = async b => (b instanceof Blob) ? { __blob: true, type: b.type, buf: await b.arrayBuffer() } : b;
const unpackBlob = v => (v && v.__blob) ? new Blob([v.buf], { type: v.type }) : v;
async function packRecord(rec) {
  const out = { ...rec };
  if ("photo" in out) out.photo = await packBlob(out.photo);
  if (out.extra) { const e = {}; for (const k in out.extra) e[k] = await packBlob(out.extra[k]); out.extra = e; }
  return out;
}
function unpackRecord(rec) {
  const out = { ...rec };
  if ("photo" in out) out.photo = unpackBlob(out.photo);
  if (out.extra) { const e = {}; for (const k in out.extra) e[k] = unpackBlob(out.extra[k]); out.extra = e; }
  return out;
}
async function putRec(rec) { const packed = await packRecord(rec); return tx("records", "readwrite", s => s.put(packed)); }
const delRec = id => tx("records", "readwrite", s => s.delete(id));
async function allRecs() { return (await tx("records", "readonly", s => s.getAll())).map(unpackRecord); }

// ---- 扫码：用相机识别条码 / 二维码，填进编号框（扫码库 zxing.min.js 第一次用到时才加载）--------
function loadZXing() {
  return window.ZXing ? Promise.resolve() : new Promise((ok, no) => {
    const s = document.createElement("script"); s.src = "zxing.min.js"; s.onload = ok; s.onerror = no; document.head.appendChild(s);
  });
}
// iPhone 的 Safari 不指定分辨率时只给 640x480，条码在画面里太小认不出来，所以要指定高分辨率。
// iPhone 还可能拒绝 video.play()（等相机权限弹窗时失去了「点击」这个动作；低电量模式也会），
// 这时 ZXing 一直等「开始播放」，既没画面也不报错——所以 3 秒还没出画面就提示，点一下屏幕手动开始。
// 平时 1080p（省电、不发烫）；4 秒还没扫到就自动换成 4K 再试：iPhone 对焦最近要 15~20 厘米，条码只能离远点拿，
// 画面里就小，分辨率越高，截出来的那一小块越清楚。
let camDevices = [], camIdx = -1, camHi = false;
const SCAN_MSG = "把条码或二维码放进框里，自动识别", HI_RES_AFTER = 4000;
let hiTimer = 0;
const camConstraints = () => ({ audio: false, video: { ...(camIdx >= 0 ? { deviceId: { exact: camDevices[camIdx].deviceId } } : { facingMode: { ideal: "environment" } }), width: { ideal: camHi ? 3840 : 1920 }, height: { ideal: camHi ? 2160 : 1080 } } });
const CAM_HINT = "画面没出来？点一下屏幕";
const IN_APP_BROWSER = /MicroMessenger|Zalo|FBAN|FBAV|Instagram|Line\/|DingTalk/i.test(navigator.userAgent);
function scanHints() {
  const Z = window.ZXing, F = Z.BarcodeFormat, hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [F.QR_CODE, F.CODE_128, F.CODE_39, F.CODE_93, F.EAN_13, F.EAN_8, F.UPC_A, F.ITF, F.DATA_MATRIX]);
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  return hints;
}
// 用不了相机时返回原因（空串 = 可以用）；微信 / Zalo / Facebook 这类软件自带的浏览器常常没有相机接口
function cameraBlocked(insecureMsg) {
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) return "";
  if (!window.isSecureContext) return insecureMsg;
  return IN_APP_BROWSER ? "这个软件内置的浏览器不能用相机，请点右上角「···」用 Safari / Chrome 打开" : "这个浏览器不支持相机扫码，请改用 Safari / Chrome";
}
function cameraErrorMsg(e) {
  const n = e && e.name;
  if (n === "NotAllowedError" || n === "SecurityError") return "没有相机权限，请在浏览器设置里允许，或手动输入";
  if (n === "NotReadableError") return "相机被别的程序占用了，请关掉后重试";
  return "打不开相机，请手动输入" + (n ? `（${n}）` : "");   // 带上错误名，方便反馈问题
}
// 不用 zxing 自带的「整帧视频」识别，改成自己从每一帧里截图再交给它认，原因有两个：
// 1) 它处理视频时用一个全局计数器 FRAME_INDEX 隔帧交替「正常 / 反色」，而开了 TRY_HARDER 的一维条码读取器
//    每帧失败后会再旋转一次图像、又把这个计数器翻一次——结果第一帧起每一帧都是「反色」，
//    黑条白底的条码永远读不出来（所有手机都扫不出）。自己截图就不经过这个计数器。
// 2) 整帧里除了条码还有大片金属 / 板子时，它判断黑白会被带偏（真实标签实测：同一个条码整帧读不出，
//    截取中间条带就能读出，反过来也有）。所以每次换一种截法轮着试。
// 另外条码小的时候，只截条码周围一小块比整帧好认（等于自动变焦）：蓝框里的、蓝框缩小到 0.6 倍的、蓝框放大 1.4 倍的，都轮着试。
// 截法 = [x, y, 宽, 高（占整帧的比例）, 是否反色]；"frame" = 蓝框所在的那一块，数字是放大倍数。
const ROI_CYCLE = [["frame", 1], [0, 0, 1, 1, false], ["frame", 0.6], [0.1, 0.3, 0.8, 0.4, false], ["frame", 1.4], [0, 0, 1, 1, true], [0.2, 0.35, 0.6, 0.3, false], [0.05, 0.375, 0.9, 0.25, false]];
const MAX_SIDE = 1600;                       // 整帧在 4K 下太大，缩到这个边长再认（只截一小块时不缩，保留细节）
// 蓝框在视频画面里的位置（占整帧的比例）；视频是铺满屏幕裁切显示的（object-fit: cover），要换算
function frameRoi(video, k) {
  const vr = video.getBoundingClientRect(), fr = document.querySelector("#scan .frame").getBoundingClientRect();
  const s = Math.max(vr.width / video.videoWidth, vr.height / video.videoHeight);
  const ox = (vr.width - video.videoWidth * s) / 2, oy = (vr.height - video.videoHeight * s) / 2;
  const cx = (fr.left + fr.width / 2 - vr.left - ox) / s, cy = (fr.top + fr.height / 2 - vr.top - oy) / s;
  const w = fr.width * k / s, h = Math.max(fr.height * k, k > 1 ? fr.width * k * 0.6 : 0) / s;   // 放大时高度至少是宽度的 0.6，二维码是方的
  const x = Math.max(0, cx - w / 2), y = Math.max(0, cy - h / 2);
  return [x / video.videoWidth, y / video.videoHeight, Math.min(w, video.videoWidth - x) / video.videoWidth, Math.min(h, video.videoHeight - y) / video.videoHeight, false];
}
function useRoiDecode(rd) {
  const Z = window.ZXing, cv = document.createElement("canvas"), g = cv.getContext("2d", { willReadFrequently: true });
  let n = 0;
  rd.timeBetweenDecodingAttempts = 100;     // 没扫到时库默认 0 毫秒就重试，手机会一直满负荷
  rd.decode = video => {
    const roi = ROI_CYCLE[n++ % ROI_CYCLE.length];
    if (!video.videoWidth) throw new Z.NotFoundException();      // 画面还没出来
    const [fx, fy, fw, fh, invert] = roi[0] === "frame" ? frameRoi(video, roi[1]) : roi;
    const sx = Math.round(video.videoWidth * fx), sy = Math.round(video.videoHeight * fy);
    const sw = Math.round(video.videoWidth * fw), sh = Math.round(video.videoHeight * fh);
    if (!sw || !sh) throw new Z.NotFoundException();
    const k = Math.min(1, MAX_SIDE / Math.max(sw, sh));
    cv.width = Math.round(sw * k); cv.height = Math.round(sh * k);
    g.drawImage(video, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
    let src = new Z.HTMLCanvasElementLuminanceSource(cv);
    if (invert) src = src.invert();

}
const camTrack = v => v.srcObject && v.srcObject.getVideoTracks()[0];
async function afterCamera(v) {
  const t = camTrack(v);
  if (t) t.applyConstraints({ advanced: [{ focusMode: "continuous" }] }).catch(() => {});
  try {
    if (!camDevices.length) camDevices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput" && !/front|user|前置/i.test(d.label));
    const cur = t && t.getSettings && t.getSettings().deviceId;
    if (cur) camIdx = camDevices.findIndex(d => d.deviceId === cur);
  } catch {}
  $("camSwap").classList.toggle("hidden", camDevices.length < 2);
}
// 让 rd 开始用相机扫；画面出来（resolve）之前如果太久，就在 msgEl 里提示点屏幕
async function openCamera(rd, videoId, msgEl, onText) {
  useRoiDecode(rd);
  const orig = msgEl.textContent, timer = setTimeout(() => { msgEl.textContent = CAM_HINT; }, 3000);
  try {
    await rd.decodeFromConstraints(camConstraints(), videoId, result => { if (result) onText(result.getText()); });
    await afterCamera($(videoId));
  } finally {
    clearTimeout(timer);
    if (msgEl.textContent === CAM_HINT) msgEl.textContent = orig;
  }
}
$("scan").addEventListener("click", () => { $("scanVideo").play().catch(() => {}); });   // 点一下屏幕 = 一次真正的用户操作，iPhone 肯放行

let reader = null, scanTarget = "";
async function startScan(id) {
  const blocked = cameraBlocked("需要用 https 网址打开才能扫码");
  if (blocked) { toast(blocked); return; }
  try { await loadZXing(); } catch { toast("扫码组件没加载出来，请联网打开一次页面"); return; }
  scanTarget = id;
  camHi = false; $("scanMsg").textContent = SCAN_MSG;
  $("scan").classList.remove("hidden");
  await runCamera();
}
async function runCamera() {
  const rd = reader = new window.ZXing.BrowserMultiFormatReader(scanHints(), 250);
  clearTimeout(hiTimer);
  try {
    await openCamera(rd, "scanVideo", $("scanMsg"), finishScan);
    if (reader !== rd) rd.reset();           // 等相机的时候已经点了取消，别让相机在后台一直开着
    else if (!camHi) hiTimer = setTimeout(() => {
      if (reader !== rd) return;
      camHi = true; $("scanMsg").textContent = "还没扫到，已切换成高清再试";
      try { rd.reset(); } catch {}
      runCamera();
    }, HI_RES_AFTER);
  } catch (e) {

  }
}
$("camSwap").onclick = () => {
  if (!reader || camDevices.length < 2) return;
  camIdx = (camIdx + 1) % camDevices.length;
  try { reader.reset(); } catch {}
  runCamera();
};
function stopScan() {
  clearTimeout(hiTimer);

  $("scan").classList.add("hidden");
}
function finishScan(text) {
  const el = $(scanTarget); text = String(text || "").trim();
  stopScan();
  if (!el || !text) return;
  el.value = text; el.dispatchEvent(new Event("input", { bubbles: true }));
  if (navigator.vibrate) navigator.vibrate(60);
  toast("已扫到：" + text);
}

// 每台都不一样的项：同款连续录入时不沿用
const UNIQUE =["设备编号", "治具编号", "物品编号", "出厂编号", "资产编号", "标签编号"];

// 把「V3-2F-M-3-1」/「V3-2F-FHA-01」拆回选择框的各项
function parsePlace(text) {
  if (TREE) return text ? { lib: text } : undefined;
  const m = /^V(\d+)-(\d+)F-(.+)$/.exec(text || "");
  if (!m) return undefined;
  const s = /^([A-Z])-(\d+)-(\d+)$/.exec(m[3]);
  return s ? { b: m[1], f: m[2], mode: "shelf", z: s[1], r: s[2], l: s[3] } : { b: m[1], f: m[2], mode: "line", n: m[3] };
}
// 以某条记录为模板新增：带入除编号外的全部信息，只需改编号、拍照
function copyRec(r) {
  type = r.type; extra = {};
  setRoom(roomOf(r));
  for (const k of Object.keys(kept)) if (k.startsWith(type)) delete kept[k];
  for (const f of TYPES[type].fields) {
    if (f.place) kept[type + "place"] = parsePlace(r.data[f.k]);
    else if (!UNIQUE.includes(f.k)) kept[type + f.k] = r.data[f.k];

async function renderList() {

    const line2 = def.cardLike ? r.data["库位"] : (nameKeyOf(def) ? [code || "自动编号", serial ? "SN " + serial : ""] : [r.data["资产编号"], r.data["厂商"]]).filter(Boolean).join(" · ");

    let img = `<div class="ph"></div>`;

    const d = new Date(r.created), p2 = n => String(n).padStart(2, "0");

// 这条记录的照片：自己有就用自己的，没有就用同型号（同类）里有照片的那条
function recPhoto(r, recs) {
  if (r.photo) return { blob: r.photo, shared: false };
  const m = r.type === "fixture" ? "" : r.data["型号"];         // 治具没有型号
  if (m) { const o = recs.find(x => x.photo && x.type === r.type && modelKey(x.type, x.data["型号"]) === modelKey(r.type, m)); if (o) return { blob: o.photo, shared: true }; }
  return { blob: null, shared: false };

}
async function refreshCount() {
  const recs = await allRecs();

}

// ---- 导出：一个 zip，里面是每类一张 CSV + photos 文件夹 --------------------------------
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

// 不压缩（JPEG 本身已压缩），文件名按 UTF-8 存，解压后中文不会乱码
function makeZip(files) {
  const enc = new TextEncoder(), chunks = [], central = [];
  const d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, time, true); h.setUint16(12, date, true); h.setUint32(14, crc, true);
    h.setUint32(18, f.data.length, true); h.setUint32(22, f.data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
    chunks.push(new Uint8Array(h.buffer), name, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, time, true); c.setUint16(14, date, true); c.setUint32(16, crc, true);
    c.setUint32(20, f.data.length, true); c.setUint32(24, f.data.length, true); c.setUint16(28, name.length, true);
    c.setUint32(42, offset, true);
    central.push(new Uint8Array(c.buffer), name);
    offset += 30 + name.length + f.data.length;
  }
  const size = central.reduce((n, p) => n + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, size, true); end.setUint32(16, offset, true);
  return new Blob([...chunks, ...central, new Uint8Array(end.buffer)], { type: "application/zip" });
}
const csvCell = v => /[",\r\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;

const stamp = () => { const d = new Date(), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; };

async function buildPackage() {
  const recs = (await allRecs()).filter(r => sel.size ? sel.has(r.id) : !r.exported).sort((a, b) => a.created - b.created);
  if (!recs.length) return null;
  const enc = new TextEncoder(), files = [], t = stamp();
  let n = 0;
  const tables = new Map();                                            // 表名 → { keys, extras, rows }：物品卡片、端子、其他房间的物品共用「物品」表，列取各类型的并集
  for (const [key, def] of Object.entries(TYPES)) {
    const mine = recs.filter(r => r.type === key);
    if (!mine.length) continue;
    const name = def.table || def.label;
    if (!tables.has(name)) tables.set(name, { keys: [], extras: def.extraPhotos || [], rows: [] });
    const table = tables.get(name);
    for (const f of def.fields) if (!table.keys.includes(f.k)) table.keys.push(f.k);
    table.rows.push(...mine);
  }
  for (const [tableName, { keys, extras, rows: mine }] of tables) {
    const cols = [...keys, PHOTO_COL, ...extras];
    const lines = [cols.map(csvCell).join(",")];
    for (const r of mine) {
      let file = "";
      if (r.photo) {
        file = `photos/${r.type}_${t}_${String(++n).padStart(3, "0")}.jpg`;
        files.push({ name: file, data: new Uint8Array(await r.photo.arrayBuffer()) });
      }
      const more = [];
      for (const k of extras) {
        const blob = xget(r, k);
        if (!blob) { more.push(""); continue; }
        const name = `photos/${r.type}_${t}_${String(++n).padStart(3, "0")}_${{ "设备标签照片": "label", "资产标签照片": "asset", "铭牌照片": "plate" }[k]}.jpg`;
        files.push({ name, data: new Uint8Array(await blob.arrayBuffer()) });
        more.push(name);
      }
      lines.push([...keys.map(k => r.data[k] || ""), file, ...more].map(csvCell).join(","));
    }
    // UTF-8 带 BOM：Excel 打开不乱码，电脑端导入也能识别
    files.unshift({ name: `${tableName}.csv`, data: enc.encode("﻿" + lines.join("\r\n") + "\r\n") });
  }
  return { blob: makeZip(files), name: `采集_${t}.zip`, ids: recs.map(r => r.id), photos: n };
}

async function markExported(ids) {
  const recs = await allRecs();
  for (const r of recs) if (ids.includes(r.id)) { r.exported = true; await putRec(r); }
  refreshCount(); if (!$("pageList").classList.contains("hidden")) renderList();
}

// 先生成文件并弹出选择框；真正的「分享」要由用户再点一次按钮触发，
// 否则 iPhone 会因为不是直接点击而拒绝调用分享。
const IN_WECHAT = /MicroMessenger/i.test(navigator.userAgent);
let pending = null;
// 微信内置浏览器不支持下载、也不支持 Web Share，之前「分享」「保存」两个按钮在微信里还留着能点，
// 点了却什么都不会发生（原地失败），容易让人以为是卡住了——这里直接把两个按钮换成提示，别让人白点
function openExportSheet() {
  $("wxTip").classList.toggle("hidden", !IN_WECHAT);
  // 「分享」按钮点了必失败就别露出来——安卓和 iPhone 的浏览器常常不让分享 zip 这种文件
  // （只对图片/视频/PDF 等少数类型开放），点了也就是弹个「分享失败」，不如直接引导去保存。
  $("doShare").classList.toggle("hidden", IN_WECHAT || !pending.canShare);
  $("doSave").classList.toggle("hidden", IN_WECHAT);
  $("mask").classList.remove("hidden");
}
async function doItemExport() {
  const pkg = await buildPackage();
  if (!pkg) { toast("没有待导出的记录"); return; }
  const file = new File([pkg.blob], pkg.name, { type: "application/zip" });
  pending = { pkg, file, blob: pkg.blob, name: pkg.name,
    canShare: !!(navigator.canShare && navigator.canShare({ files: [file] })) };
  $("sheetInfo").textContent = `${pkg.ids.length} 条记录，${pkg.photos} 张照片，${(pkg.blob.size / 1048576).toFixed(1)} MB` +
    (pending.canShare ? "" : "。此环境不支持直接分享，请点「保存到手机」，再打开微信自己发一条消息（比如发给「文件传输助手」），点「+」选「文件」找到它发送");
  openExportSheet();
}
function closeSheet() { $("mask").classList.add("hidden"); pending = null; }
async function finish(how) {
  const p = pending; closeSheet();
  sel.clear();
  await markExported(p.pkg.ids);
  updateSel();
  toast(`${how}：${p.pkg.ids.length} 条，${p.pkg.photos} 张照片`);
}
async function shareNow() {
  if (!pending) return;
  if (!navigator.share) { toast("此浏览器或连接方式不支持分享，请改用「保存到手机」"); return; }
  try { await navigator.share({ files: [pending.file], title: pending.name }); }
  catch (e) { if (e.name !== "AbortError") toast(`分享失败（${e.name || e}），请改用「保存到手机」`); return; }
  finish("已分享");
}
function saveNow() {
  if (!pending) return;
  if (IN_WECHAT) { toast("微信里不能下载，请点右上角「···」→「在浏览器打开」后再导出"); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(pending.blob); a.download = pending.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  finish("已保存");
}

// ---- 事件 -----------------------------------------------------------------------------
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const tab = b.dataset.tab;
  const wasHere = b.classList.contains("on");                    // 第一次点只是回到这个页面；已经在这个页面上再点才弹出房间选择
  for (const x of $("tabs").children) x.classList.toggle("on", x === b);
  $("pageNew").classList.toggle("hidden", tab !== "new");
  $("pageList").classList.toggle("hidden", tab !== "list");
  $("save").classList.toggle("hidden", tab !== "new");
  $("clearForm").classList.toggle("hidden", tab !== "new" || !!editingId);
  if (tab === "list") renderList();
  const open = tab === "new" && wasHere && e.isTrusted && !editingId && $("roomMenu").classList.contains("hidden");
  $("roomMenu").classList.toggle("hidden", !open);               // 在录入页上再点一下「录入」才弹出房间选择（再点一下收起）
});
$("roomMenu").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  $("roomMenu").classList.add("hidden");
  if (b.dataset.room === room) return;
  setRoom(b.dataset.room);
  clearKept(); extra = {}; renderTypes(); renderForm();
});
document.addEventListener("click", e => { if (!e.target.closest("#roomMenu, #tabs")) $("roomMenu").classList.add("hidden"); });
$("types").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  type = b.dataset.type; extra = {}; renderTypes(); renderForm();
});
$("fields").addEventListener("click", e => {
  const b = e.target.closest("#p_mode button"); if (!b) return;
  const shelf = b.dataset.m === "shelf";
  $("p_mode").dataset.mode = b.dataset.m;
  for (const x of $("p_mode").children) x.classList.toggle("on", x === b);
  $("p_shelf").classList.toggle("hidden", !shelf);
  $("p_line").classList.toggle("hidden", shelf);
  updatePlaceView();
});
$("fields").addEventListener("input", e => {
  const el = e.target, k = el.id && el.id.slice(2);
  if (el.dataset && el.dataset.code && !e.isComposing) { const c = codeClean(k, el.value); if (c !== el.value) el.value = c; }
  if (el.classList && el.classList.contains("partin") && !e.isComposing) { const c = partClean(el.value); if (c !== el.value) el.value = c; }
  if (k === "型号") fillMaker();
  updatePlaceView(); updatePhotoHint(); syncFilled(); });
$("fields").addEventListener("change", () => { toggleWhen(); syncFilled(); });
// 日期框：没点之前是普通文字框（好放名称），点进去才变成日期选择
$("fields").addEventListener("focusin", e => {
  const el = e.target;
  if (el.dataset && el.dataset.date && el.type === "text") { el.type = "date"; try { el.showPicker && el.showPicker(); } catch {} }
});
$("fields").addEventListener("focusout", e => {
  const el = e.target;
  if (el.dataset && el.dataset.date && el.type === "date" && !el.value) el.type = "text";
  syncFilled();
});
$("fields").addEventListener("click", e => {
  const b = e.target.closest("[data-scan]"); if (b) startScan(b.dataset.scan);
  if (e.target.closest("[data-addpart]")) {
    const box = $("partsBox"); box.insertAdjacentHTML("beforeend", partRow(""));
    box.lastElementChild.querySelector("input").focus();
  }
  const del = e.target.closest("[data-delpart]"); if (del) { del.closest(".fl").remove(); syncFilled(); }
  const chip = e.target.closest("[data-cc]");                               // 类型按钮：点一下选中（再点一下取消）
  if (chip) {
    const box = chip.parentElement, input = box.nextElementSibling, on = !chip.classList.contains("on");
    box.querySelectorAll(".cc").forEach(c => c.classList.remove("on"));
    chip.classList.toggle("on", on); input.value = on ? chip.dataset.cc : "";
  }
  const add = e.target.closest("[data-ccadd]");                             // 新类型：记在这台手机里，电脑端导入时自动加进类别列表
  if (add) {
    const name = (prompt("新的类型，例如 加工件", "") || "").replace(/[\s,，"]+/g, "").slice(0, 20);
    if (!name) return;
    try { localStorage.setItem("customCats", JSON.stringify([...new Set([...customCats(), name])])); } catch {}
    const input = add.parentElement.nextElementSibling;
    if (!input.value) input.value = name;
    snapshotForm(); renderForm();
  }
});
$("scanCancel").onclick = stopScan;
$("xphotos").addEventListener("click", e => {
  const b = e.target.closest("[data-x]"); if (!b) return;
  extraTarget = b.dataset.x; $("xcam").click();
});
$("xcam").onchange = async e => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file || !extraTarget) return;
  const k = extraTarget;
  try { extra[k] = await shrink(file, 1600); showExtra(k); } catch { toast("这张图片读不出来，请重拍"); }
};
$("shoot").onclick = () => $("cam").click();
$("cam").onchange = onFile;
// 点缩略图放大看，再点一下关闭
document.addEventListener("click", e => {
  const img = e.target.closest(".pv img, .dphotos img");
  if (img) { $("lbImg").src = img.src; $("lb").classList.remove("hidden"); }
});
$("lb").onclick = () => { $("lb").classList.add("hidden"); $("lbImg").removeAttribute("src"); };
$("save").onclick = () => save().catch(e => toast("保存失败：" + (e && e.message ? e.message : e)));
$("export").onclick = () => doItemExport().catch(() => toast("导出失败"));
// 清空当前填写的内容（信息、照片、沿用下来的内容全部清掉）
$("clearForm").onclick = () => {
  const filled = [...$("fields").querySelectorAll("input,select,textarea")].some(e => e.value) || photo || Object.keys(extra).length;
  if (filled && !confirm(T("清空当前填写的内容？"))) return;
  for (const k of Object.keys(kept)) if (k.startsWith(type)) delete kept[k];
  extra = {}; setPhoto(null); renderForm();
  $("main").scrollTo({ top: 0 });
  toast("已清空");
};
$("doShare").onclick = shareNow;
$("doSave").onclick = saveNow;
$("doCancel").onclick = closeSheet;
$("selAll").onclick = () => {
  const all = listIds.length > 0 && listIds.every(id => sel.has(id));
  sel.clear(); if (!all) listIds.forEach(id => sel.add(id));
  renderList();
};
$("list").addEventListener("click", e => {
  const c = e.target.closest("[data-sel]");
  if (c) {
    const id = Number(c.dataset.sel), box = c.querySelector("input");
    if (e.target !== box) box.checked = !box.checked;
    box.checked ? sel.add(id) : sel.delete(id);
    updateSel(); return;
  }
  const b = e.target.closest("[data-open]"); if (b) openDetail(Number(b.dataset.open));
});
$("dClose").onclick = closeDetail;
$("detail").addEventListener("click", e => { if (e.target === $("detail")) closeDetail(); });
$("dEdit").onclick = async () => { const r = await detailRec(); if (r) editRec(r); };
$("dCopy").onclick = async () => { const r = await detailRec(); if (r) { closeDetail(); copyRec(r); } };
$("dDel").onclick = async () => {
  const r = await detailRec(); if (!r) return;
  if (!confirm(T("删除这条记录？删除后不能恢复。"))) return;
  await delRec(r.id); closeDetail(); renderList(); refreshCount(); refreshModelPhotos();
  if (editingId === r.id) leaveEdit();
};
$("editCancel").onclick = () => { leaveEdit(); document.querySelector('#tabs [data-tab="list"]').click(); };
$("clearDone").onclick = async () => {
  const done = (await allRecs()).filter(r => r.exported);
  if (!done.length) { toast("没有已导出的记录"); return; }
  if (!confirm(T(`删除已导出的 ${done.length} 条记录（含照片）？删除后不能恢复。`))) return;
  for (const r of done) await delRec(r.id);
  renderList(); refreshCount(); refreshModelPhotos();
};

try { const m = localStorage.getItem("keepMode"); if (m) $("keepMode").value = m; } catch {}
$("langBtn").onclick = () => {
  snapshotForm();
  lang = lang === "vi" ? "zh" : "vi";
  try { localStorage.setItem("lang", lang); } catch {}
  closeDetail();
  renderForm();
  applyLang();
  refreshMapLang();
  if (!$("pageList").classList.contains("hidden")) renderList();
};
setRoom(room); renderTypes(); renderForm(); refreshCount(); refreshModelPhotos(); applyLang(); setupMap(); setupPicker();
if (!window.isSecureContext) $("insecureBar").classList.remove("hidden");
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

// 检查更新：拿线上 sw.js 里的版本号，和手机里正在用的缓存版本比；不一样就让新版下载好，再由用户点一下才刷新（不会打断正在填的内容）
const cacheVer = async () => (await caches.keys()).filter(k => k.startsWith("collector-")).sort().pop() || "";
$("updBtn").onclick = async () => {
  const b = $("updBtn");
  if (b.classList.contains("new")) { location.reload(); return; }
  b.disabled = true; b.textContent = "检查中…";
  try {
    const live = ((await (await fetch("sw.js?t=" + Date.now(), { cache: "no-store" })).text()).match(/CACHE = "([^"]+)"/) || [])[1];
    if (!live) throw new Error("no version");
    if (live === await cacheVer()) { toast((lang === "vi" ? "Đã là bản mới nhất (" : "已是最新版（") + live.replace("collector-", "") + (lang === "vi" ? ")" : "）")); b.textContent = "检查更新"; }
    else {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) await reg.update();
      for (let i = 0; i < 20 && live !== await cacheVer(); i++) await new Promise(r => setTimeout(r, 500));
      if (live === await cacheVer()) { toast("发现新版，点按钮更新（已录的记录不会丢）"); b.textContent = "点此更新"; b.classList.add("new"); }
      else { toast("检查失败，请确认已联网"); b.textContent = "检查更新"; }
    }
  } catch { toast("检查失败，请确认已联网"); b.textContent = "检查更新"; }
  b.disabled = false;
};
</script>
